name: '🐛 Bug Fix'
description: "Something isn't working correctly. For urgent production outages use the Hotfix template."
title: '[Bug] '
labels:
  - 'type:bugfix'
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Use this template for broken or incorrect behaviour. For urgent production outages use **Hotfix**.

  - type: textarea
    id: description
    attributes:
      label: "What's broken?"
      description: 'Describe the incorrect behaviour and how it differs from what is expected.'
      placeholder: 'Providers page shows a blank list when navigating from the home page search.'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 'Steps to Reproduce'
      placeholder: |
        1. Go to the home page
        2. Type a search term and press Enter
        3. Observe blank providers list
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 'Expected Behaviour'
      placeholder: 'Providers matching the search term should be displayed.'
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 'Acceptance Criteria'
      description: "Each item on a new line starting with '- [ ]'."
      placeholder: |
        - [ ] Providers list is populated after navigating from home search
        - [ ] No regression on direct /providers navigation
    validations:
      required: true

  - type: input
    id: target_release
    attributes:
      label: 'Target Release'
      description: 'Semver target (e.g. v0.10.9). Leave blank if unknown.'
      placeholder: 'v0.10.9'

  - type: dropdown
    id: area
    attributes:
      label: 'Area'
      description: 'Becomes the area:* label. Parallel lanes never share an area, so pick the one the fix lives in.'
      options:
        - 'auth'
        - 'search'
        - 'providers'
        - 'map'
        - 'dashboard'
        - 'admin'
        - 'i18n'
        - 'pwa'
        - 'db'
        - 'ci'
        - 'infra'
        - 'ui'
        - 'imports'
        - 'docs'
        - 'deps'
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 'Priority'
      description: 'P0 blocks users or leaks data. P1 this week. P2 next. P3 someday.'
      options:
        - 'P0'
        - 'P1'
        - 'P2'
        - 'P3'
    validations:
      required: true
