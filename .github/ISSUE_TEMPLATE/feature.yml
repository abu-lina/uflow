name: '✨ Feature'
description: 'New feature or capability request. For urgent production issues use the Hotfix template.'
title: '[Feature] '
labels:
  - 'type:feature'
body:
  - type: markdown
    attributes:
      value: |
        ## New Feature Request
        Use this template for new capabilities or enhancements. For bugs use **Bug Fix**; for urgent production issues use **Hotfix**.

  - type: textarea
    id: description
    attributes:
      label: 'Description / Value Statement'
      description: 'As a [who], I want [what], so that [why].'
      placeholder: 'As a provider, I want to see my endorsement count, so that I can track trust-building progress.'
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 'Acceptance Criteria'
      description: "Observable, testable criteria. Each item on a new line starting with '- [ ]'."
      placeholder: |
        - [ ] Endorsement count visible on provider profile
        - [ ] Count updates within 5 seconds of a new endorsement
    validations:
      required: true

  - type: input
    id: target_release
    attributes:
      label: 'Target Release'
      description: 'Semver target (e.g. v0.11.0). Leave blank if unknown.'
      placeholder: 'v0.11.0'

  - type: dropdown
    id: area
    attributes:
      label: 'Area'
      description: 'Becomes the area:* label. Parallel lanes never share an area, so pick the one the fix lives in.'
      options:
        - 'auth'
        - 'search'
        - 'providers'
        - 'map'
        - 'dashboard'
        - 'admin'
        - 'i18n'
        - 'pwa'
        - 'db'
        - 'ci'
        - 'infra'
        - 'ui'
        - 'imports'
        - 'docs'
        - 'deps'
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 'Priority'
      description: 'P0 blocks users or leaks data. P1 this week. P2 next. P3 someday.'
      options:
        - 'P0'
        - 'P1'
        - 'P2'
        - 'P3'
    validations:
      required: true
