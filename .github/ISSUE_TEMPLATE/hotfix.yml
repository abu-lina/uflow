name: '🚨 Hotfix'
description: 'URGENT production issue — active outage, data loss risk, or security breach. For non-critical bugs use Bug Fix.'
title: '[Hotfix] '
labels:
  - 'type:hotfix'
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Hotfix — URGENT Production Issues Only
        **This template is for active production outages, data loss risk, or security breaches.**
        For non-urgent broken behaviour, please use the **Bug Fix** template instead.

  - type: textarea
    id: description
    attributes:
      label: 'What is broken in production?'
      description: 'Describe the impact and urgency. Who is affected? How many users?'
      placeholder: 'Login is failing for all users. 100% of auth attempts return 500 since deploy v0.10.7.'
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 'User Impact'
      description: 'Scope of affected users/routes and business impact.'
      placeholder: 'All logged-in users are locked out. Affects provider onboarding flow entirely.'
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 'Acceptance Criteria'
      description: 'Minimal criteria to confirm the production issue is resolved.'
      placeholder: |
        - [ ] Login succeeds for all auth providers
        - [ ] No 500 errors on /api/auth routes
        - [ ] Smoke test passes on production
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 'Area'
      description: 'Becomes the area:* label. Parallel lanes never share an area, so pick the one the fix lives in.'
      options:
        - 'auth'
        - 'search'
        - 'providers'
        - 'map'
        - 'dashboard'
        - 'admin'
        - 'i18n'
        - 'pwa'
        - 'db'
        - 'ci'
        - 'infra'
        - 'ui'
        - 'imports'
        - 'docs'
        - 'deps'
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 'Priority'
      description: 'P0 blocks users or leaks data. P1 this week. P2 next. P3 someday.'
      options:
        - 'P0'
        - 'P1'
        - 'P2'
        - 'P3'
    validations:
      required: true
