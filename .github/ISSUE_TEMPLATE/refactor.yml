name: '♻️ Refactor'
description: 'Code restructuring, technical debt reduction, or internal improvement with no user-facing behaviour change.'
title: '[Refactor] '
labels:
  - 'type:refactor'
body:
  - type: markdown
    attributes:
      value: |
        ## Refactor Request
        Use this for restructuring existing code without changing observable behaviour. For new capabilities use **Feature**.

  - type: textarea
    id: description
    attributes:
      label: 'What needs refactoring and why?'
      description: 'Describe the current state and the desired outcome.'
      placeholder: 'The auth middleware has grown to 400 lines and mixes concerns. Extract token validation, session renewal, and role checks into separate modules.'
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 'Acceptance Criteria'
      description: "Each item on a new line starting with '- [ ]'. Behaviour should be unchanged — focus on structural goals."
      placeholder: |
        - [ ] Auth logic split into token.ts, session.ts, roles.ts
        - [ ] All existing tests pass unchanged
        - [ ] No new public API surface added
    validations:
      required: true

  - type: input
    id: target_release
    attributes:
      label: 'Target Release'
      description: 'Semver target or leave blank.'
      placeholder: 'v0.11.0'

  - type: dropdown
    id: area
    attributes:
      label: 'Area'
      description: 'Becomes the area:* label. Parallel lanes never share an area, so pick the one the fix lives in.'
      options:
        - 'auth'
        - 'search'
        - 'providers'
        - 'map'
        - 'dashboard'
        - 'admin'
        - 'i18n'
        - 'pwa'
        - 'db'
        - 'ci'
        - 'infra'
        - 'ui'
        - 'imports'
        - 'docs'
        - 'deps'
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 'Priority'
      description: 'P0 blocks users or leaks data. P1 this week. P2 next. P3 someday.'
      options:
        - 'P0'
        - 'P1'
        - 'P2'
        - 'P3'
    validations:
      required: true
