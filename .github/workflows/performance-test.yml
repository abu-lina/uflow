name: Performance Tests

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline
          - load
          - stress
          - spike
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  push:
    branches:
      - main
    paths:
      - 'tests/performance/**'
      - '.github/workflows/performance-test.yml'

jobs:
  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Verify k6 installation
        run: k6 version

      - name: Set environment variables
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "BASE_URL=${{ secrets.PRODUCTION_URL }}" >> $GITHUB_ENV
          else
            echo "BASE_URL=${STAGING_URL:-http://localhost:3000}" >> $GITHUB_ENV
          fi
          echo "ENV=${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_ENV
          echo "TEST_USER_EMAIL=${TEST_USER_EMAIL}" >> $GITHUB_ENV
          echo "TEST_USER_PASSWORD=${TEST_USER_PASSWORD}" >> $GITHUB_ENV
          echo "TEST_ADMIN_EMAIL=${TEST_ADMIN_EMAIL}" >> $GITHUB_ENV
          echo "TEST_ADMIN_PASSWORD=${TEST_ADMIN_PASSWORD}" >> $GITHUB_ENV

      - name: Make test script executable
        run: chmod +x tests/performance/run-tests.sh

      - name: Run performance tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
          ENV: ${{ env.ENV }}
          TEST_USER_EMAIL: ${{ env.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ env.TEST_USER_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ env.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ env.TEST_ADMIN_PASSWORD }}
        run: |
          TEST_TYPE=${{ github.event.inputs.test_type || 'baseline' }}
          bash tests/performance/run-tests.sh "$TEST_TYPE"
        continue-on-error: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-test-reports
          path: tests/performance/reports/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const reportsDir = 'tests/performance/reports';
            if (fs.existsSync(reportsDir)) {
              const files = fs.readdirSync(reportsDir);
              const summaryFiles = files.filter(f => f.endsWith('_summary.txt'));
              
              if (summaryFiles.length > 0) {
                let comment = '## Performance Test Results\n\n';
                summaryFiles.slice(0, 5).forEach(file => {
                  const content = fs.readFileSync(path.join(reportsDir, file), 'utf8');
                  comment += `### ${file}\n\n\`\`\`\n${content}\n\`\`\`\n\n`;
                });
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            }