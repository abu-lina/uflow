name: Main CI Pipeline

on:
  push:
    branches: [main, develop, 'feat/*', 'fix/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # Allow manual triggering

env:
  NODE_VERSION: '20'

jobs:
  # Essential Quality Checks (Fast, runs first)
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Check for unused dependencies
        run: npx depcheck

  # Unit and Integration Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Build and Basic Functionality Test
  build-and-test:
    name: Build & Basic Test
    runs-on: ubuntu-latest
    needs: [quality-checks, test]
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          echo "Building application..."
          npx next build

      - name: Start application
        run: |
          echo "Starting application..."
          npx next start &
        env:
          NODE_ENV: test
          PORT: 3000

      - name: Wait for app to be ready
        run: |
          echo "Waiting for application to start..."
          timeout=60
          while ! curl -f http://localhost:3000 > /dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "❌ Application failed to start within 60 seconds"
              exit 1
            fi
            timeout=$((timeout - 1))
            sleep 1
            echo -n "."
          done
          echo "✅ Application is ready"

      - name: Test critical endpoints
        run: |
          echo "Testing critical endpoints..."
          
          # Test essential pages
          endpoints=("/" "/souks" "/profile" "/create" "/saved")
          
          for endpoint in "${endpoints[@]}"; do
            echo "Testing $endpoint..."
            response=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$endpoint")
            if [ "$response" = "200" ] || [ "$response" = "302" ]; then
              echo "✅ $endpoint accessible (HTTP $response)"
            else
              echo "❌ $endpoint failed (HTTP $response)"
              exit 1
            fi
          done
          
          echo "✅ All critical endpoints working"

      - name: Stop application
        if: always()
        run: |
          echo "Stopping application..."
          pkill -f "next start" || true

      - name: Analyze bundle size
        run: |
          echo "## 📦 Bundle Size Analysis" > bundle-report.md
          echo "" >> bundle-report.md
          echo "### Build Output Size:" >> bundle-report.md
          if [ -d ".next" ]; then
            du -sh .next >> bundle-report.md
            echo "" >> bundle-report.md
            echo "### Key Files:" >> bundle-report.md
            find .next -name "*.js" -exec du -h {} \; | head -10 >> bundle-report.md
          fi

      - name: Upload bundle report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: bundle-report.md

  # Security Check (Basic)
  security-basic:
    name: Basic Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate

  # Final Status Report
  status-report:
    name: CI Status Report
    runs-on: ubuntu-latest
    needs: [quality-checks, test, build-and-test, security-basic]
    if: always()
    timeout-minutes: 2
    
    steps:
      - name: Generate status report
        run: |
          echo "## 🚀 CI Pipeline Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Quality Checks**: ${{ needs.quality-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Tests**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Build & Test**: ${{ needs.build-and-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Security**: ${{ needs.security-basic.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.quality-checks.result }}" == "success" ] && \
             [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.build-and-test.result }}" == "success" ] && \
             [ "${{ needs.security-basic.result }}" == "success" ]; then
            echo "🎉 **All CI checks passed!** Your code is ready for deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some CI checks failed.** Please review the logs above." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What was tested:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code quality (ESLint, TypeScript, dependency check)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Unit and integration tests with coverage" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Application build and critical endpoint testing" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Basic security audit" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Check the artifacts above for detailed reports and metrics."
