name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, 'feat/*', 'fix/*']
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # Supply chain IOC scan - runs FIRST, gates all other jobs
  supply-chain-ioc-scan:
    name: Supply Chain IOC Scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run IOC scanner
        run: bash scripts/security/ioc-scan.sh

  # Fast quality checks - run in parallel (after IOC scan passes)
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: [supply-chain-ioc-scan]
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

  # Unit and integration tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [supply-chain-ioc-scan]
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

  # Build verification (runs in parallel with other checks, after IOC scan)
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [supply-chain-ioc-scan]
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build application
        shell: bash
        run: set -o pipefail && npx next build 2>&1 | tee .next-build-output.txt

      - name: Check build output
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build failed - .next directory not found"
            exit 1
          fi
          # Save build output for budget checker
          mkdir -p .next
          mv .next-build-output.txt .next/BUILD_OUTPUT.txt
          echo "✅ Build completed successfully"

      - name: Check performance budgets
        run: npm run perf:check-budgets

  # Security audit (basic, fast)
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [supply-chain-ioc-scan]
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # Summary
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [supply-chain-ioc-scan, lint-and-type-check, test, build, security]
    if: always()
    timeout-minutes: 2
    
    steps:
      - name: Check all jobs
        run: |
          echo "## 🚀 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Supply Chain IOC Scan | ${{ needs.supply-chain-ioc-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint-and-type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.supply-chain-ioc-scan.result }}" == "success" ] && \
             [ "${{ needs.lint-and-type-check.result }}" == "success" ] && \
             [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ **All CI checks passed!**" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "❌ **Some CI checks failed.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
