# .github/workflows/import-joinhalal.yml
#
# JoinHalal Provider Data Operations
# Runs the import script against production/UAT Supabase using GitHub Secrets.
#
# Usage:
#   1. Go to Actions → "JoinHalal Provider Operations"
#   2. Click "Run workflow"
#   3. Choose the operation, mode, and environment
#   4. Review output in the workflow logs
#
# Operations:
#   - import:             Fetch & upsert providers from JoinHalal sitemaps
#   - backfill-alcohol:   Re-evaluate existing providers for Alkohol badges → reject
#   - recover-provenance: Match legacy providers to JoinHalal source URLs
#   - audit-stale-clone:  Report providers that may be stale clones
#
# Security:
#   - Uses SUPABASE_SERVICE_ROLE_KEY from GitHub Secrets (never exposed in logs)
#   - Requires manual trigger (workflow_dispatch) — no accidental runs
#   - Dry-run is the default to prevent unintended writes

name: JoinHalal Provider Operations

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to run'
        required: true
        default: 'import'
        type: choice
        options:
          - import
          - backfill-alcohol
          - recover-provenance
          - audit-stale-clone
      mode:
        description: 'Execution mode (ignored for audit-stale-clone)'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - write
      limit:
        description: 'Provider limit (import only)'
        required: true
        default: '50'
        type: choice
        options:
          - '10'
          - '50'
          - '100'
          - 'all'
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - uat

jobs:
  run:
    name: '${{ inputs.operation }} (${{ inputs.mode }})'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI arguments
        id: args
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          OP="$INPUT_OPERATION"
          MODE="$INPUT_MODE"

          if [ "$OP" = "import" ]; then
            echo "cli_args=--${MODE} --limit $INPUT_LIMIT" >> "$GITHUB_OUTPUT"
          elif [ "$OP" = "audit-stale-clone" ]; then
            echo "cli_args=--audit-stale-clone" >> "$GITHUB_OUTPUT"
          else
            echo "cli_args=--${OP} --${MODE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run operation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_MODE: ${{ inputs.mode }}
          CLI_ARGS: ${{ steps.args.outputs.cli_args }}
        run: |
          echo "🚀 Running JoinHalal [$INPUT_OPERATION] against $INPUT_ENVIRONMENT"
          echo "   Mode: $INPUT_MODE"
          echo "   Args: $CLI_ARGS"
          echo ""
          npx tsx scripts/import-joinhalal.ts $CLI_ARGS

      - name: Summary
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_MODE: ${{ inputs.mode }}
          CLI_ARGS: ${{ steps.args.outputs.cli_args }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "## Operation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Operation | $INPUT_OPERATION |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | $INPUT_ENVIRONMENT |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | $INPUT_MODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Args | \`$CLI_ARGS\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | $ACTOR |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY
          if [ "$INPUT_OPERATION" = "backfill-alcohol" ] && [ "$INPUT_MODE" = "write" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Providers with Alkohol badges set to \`review_status = 'rejected'\`**" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$INPUT_OPERATION" = "import" ] && [ "$INPUT_MODE" = "write" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Records inserted with \`review_status = 'pending'\`**" >> $GITHUB_STEP_SUMMARY
            echo "Approve via admin moderation UI or SQL:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`sql" >> $GITHUB_STEP_SUMMARY
            echo "UPDATE providers SET review_status = 'approved'" >> $GITHUB_STEP_SUMMARY
            echo "WHERE user_created_id = '00000000-0000-0000-0000-000047000001';" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
