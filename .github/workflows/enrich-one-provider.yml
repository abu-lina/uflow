name: Enrich Single Provider (Wolt)

on:
  workflow_dispatch:
    inputs:
      provider-id:
        description: 'Provider UUID'
        required: true
        type: string
      wolt-url:
        description: 'Full Wolt restaurant URL'
        required: true
        type: string

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        # Uses cached node_modules — should take ~20s with cache

      - name: Enrich from Wolt via Apify
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          echo "Enriching ${{ github.event.inputs.provider-id }} from ${{ github.event.inputs.wolt-url }}"
          npx tsx scripts/enrich-one-wolt.ts \
            "${{ github.event.inputs.provider-id }}" \
            "${{ github.event.inputs.wolt-url }}"
