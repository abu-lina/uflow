name: Security Scanning & Vulnerability Detection

on:
  schedule:
    # Run weekly on Sundays at 4 AM UTC for security scanning
    - cron: '0 4 * * 0'
  workflow_dispatch: # Allow manual triggering
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  # Dependency Security Audit
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "Running npm security audit..."
          npm audit --audit-level=moderate --json > audit-report.json || true
          
          # Check for high/critical vulnerabilities
          if npm audit --audit-level=high; then
            echo "✅ No high/critical vulnerabilities found"
          else
            echo "⚠️ High/critical vulnerabilities detected"
            echo "Check the audit report for details"
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

  # Snyk Security Scan
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-report.json

      - name: Upload Snyk report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-security-report
          path: snyk-report.json
          retention-days: 30

  # Code Security Analysis
  code-security:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Security code scan
        run: |
          echo "## 🔒 Code Security Analysis" > code-security-report.md
          echo "" >> code-security-report.md
          echo "### Scanning for security issues..." >> code-security-report.md
          echo "" >> code-security-report.md
          
          # Check for dangerous functions
          echo "### Dangerous Function Usage:" >> code-security-report.md
          
          # Check for eval usage
          eval_count=$(grep -r "eval(" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | wc -l)
          if [ "$eval_count" -gt 0 ]; then
            echo "❌ **eval() function found**: $eval_count instances" >> code-security-report.md
            echo "This is a security risk. Avoid using eval() in production code." >> code-security-report.md
          else
            echo "✅ **eval() function**: None found" >> code-security-report.md
          fi
          
          # Check for innerHTML usage
          innerhtml_count=$(grep -r "innerHTML" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | wc -l)
          if [ "$innerhtml_count" -gt 0 ]; then
            echo "⚠️ **innerHTML usage**: $innerhtml_count instances" >> code-security-report.md
            echo "Ensure proper sanitization to prevent XSS attacks." >> code-security-report.md
          else
            echo "✅ **innerHTML usage**: None found" >> code-security-report.md
          fi
          
          # Check for hardcoded secrets
          echo "" >> code-security-report.md
          echo "### Hardcoded Secrets Check:" >> code-security-report.md
          
          # Check for potential API keys or secrets
          secret_patterns=("api_key" "secret" "password" "token" "key:")
          for pattern in "${secret_patterns[@]}"; do
            count=$(grep -r -i "$pattern" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | grep -v "NEXT_PUBLIC_" | wc -l)
            if [ "$count" -gt 0 ]; then
              echo "⚠️ **Potential secrets found**: $count instances of '$pattern'" >> code-security-report.md
            else
              echo "✅ **No secrets found**: Pattern '$pattern'" >> code-security-report.md
            fi
          done
          
          echo "" >> code-security-report.md
          echo "### Security Recommendations:" >> code-security-report.md
          echo "- Use environment variables for sensitive data" >> code-security-report.md
          echo "- Implement proper input validation and sanitization" >> code-security-report.md
          echo "- Use HTTPS in production" >> code-security-report.md
          echo "- Regular dependency updates" >> code-security-report.md
          echo "- Implement Content Security Policy (CSP)" >> code-security-report.md

      - name: Upload code security report
        uses: actions/upload-artifact@v4
        with:
          name: code-security-report
          path: code-security-report.md

  # Environment Security Check
  env-security:
    name: Environment Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check environment configuration
        run: |
          echo "## 🌍 Environment Security Check" > env-security-report.md
          echo "" >> env-security-report.md
          echo "### Environment Variable Analysis:" >> env-security-report.md
          echo "" >> env-security-report.md
          
          # Check .env.example file
          if [ -f ".env.example" ]; then
            echo "✅ **Environment template exists**: .env.example found" >> env-security-report.md
            
            # Check for sensitive patterns in example
            sensitive_patterns=("SECRET" "KEY" "PASSWORD" "TOKEN")
            for pattern in "${sensitive_patterns[@]}"; do
              if grep -q "$pattern" .env.example; then
                echo "⚠️ **Sensitive pattern found**: '$pattern' in .env.example" >> env-security-report.md
              fi
            done
          else
            echo "❌ **Environment template missing**: .env.example not found" >> env-security-report.md
          fi
          
          # Check for .env files in git
          env_files=$(git ls-files | grep "\.env" | grep -v "\.env\.example")
          if [ -n "$env_files" ]; then
            echo "❌ **Environment files in git**: Found $env_files" >> env-security-report.md
            echo "Remove .env files from version control!" >> env-security-report.md
          else
            echo "✅ **No environment files in git**: Good security practice" >> env-security-report.md
          fi
          
          echo "" >> env-security-report.md
          echo "### Security Best Practices:" >> env-security-report.md
          echo "- ✅ Use .env.example for documentation" >> env-security-report.md
          echo "- ✅ Never commit .env files" >> env-security-report.md
          echo "- ✅ Use GitHub Secrets for sensitive data" >> env-security-report.md
          echo "- ✅ Validate environment variables at runtime" >> env-security-report.md

      - name: Upload environment security report
        uses: actions/upload-artifact@v4
        with:
          name: env-security-report
          path: env-security-report.md

  # Build Security Check
  build-security:
    name: Build Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          echo "Building application for security analysis..."
          npx next build

      - name: Analyze build output
        run: |
          echo "## 🏗️ Build Security Analysis" > build-security-report.md
          echo "" >> build-security-report.md
          echo "### Build Output Security Check:" >> build-security-report.md
          echo "" >> build-security-report.md
          
          if [ -d ".next" ]; then
            echo "✅ **Build successful**: .next directory created" >> build-security-report.md
            
            # Check for source maps in production build
            source_maps=$(find .next -name "*.map" | wc -l)
            if [ "$source_maps" -gt 0 ]; then
              echo "⚠️ **Source maps found**: $source_maps source map files" >> build-security-report.md
              echo "Consider removing source maps in production for security" >> build-security-report.md
            else
              echo "✅ **No source maps**: Good for production security" >> build-security-report.md
            fi
            
            # Check build size
            build_size=$(du -sh .next | cut -f1)
            echo "📦 **Build size**: $build_size" >> build-security-report.md
            
            # Check for exposed environment variables
            env_vars=$(grep -r "NEXT_PUBLIC_" .next --include="*.js" | wc -l)
            if [ "$env_vars" -gt 0 ]; then
              echo "✅ **Public env vars**: $env_vars instances (expected)" >> build-security-report.md
            else
              echo "⚠️ **No public env vars**: Check environment configuration" >> build-security-report.md
            fi
            
          else
            echo "❌ **Build failed**: .next directory not found" >> build-security-report.md
          fi
          
          echo "" >> build-security-report.md
          echo "### Security Recommendations:" >> build-security-report.md
          echo "- Remove source maps in production" >> build-security-report.md
          echo "- Validate build output size" >> build-security-report.md
          echo "- Check for exposed sensitive data" >> build-security-report.md
          echo "- Use environment variable validation" >> build-security-report.md

      - name: Upload build security report
        uses: actions/upload-artifact@v4
        with:
          name: build-security-report
          path: build-security-report.md

  # Security Summary
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, snyk-scan, code-security, env-security, build-security]
    timeout-minutes: 5
    
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports/

      - name: Generate security summary
        run: |
          echo "## 🔒 Security Scanning Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Scan Results:" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "reports/npm-audit-report/audit-report.json" ]; then
            echo "- ✅ **Dependency Audit**: Completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Dependency Audit**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "reports/snyk-security-report/snyk-report.json" ]; then
            echo "- ✅ **Snyk Security Scan**: Completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Snyk Security Scan**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "reports/code-security-report/code-security-report.md" ]; then
            echo "- ✅ **Code Security Analysis**: Completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Code Security Analysis**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "reports/env-security-report/env-security-report.md" ]; then
            echo "- ✅ **Environment Security**: Completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Environment Security**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "reports/build-security-report/build-security-report.md" ]; then
            echo "- ✅ **Build Security**: Completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Build Security**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Insights:" >> $GITHUB_STEP_SUMMARY
          echo "- Regular dependency updates are crucial" >> $GITHUB_STEP_SUMMARY
          echo "- Code review for security best practices" >> $GITHUB_STEP_SUMMARY
          echo "- Environment variable management" >> $GITHUB_STEP_SUMMARY
          echo "- Build output security validation" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 Check the artifacts above for detailed security reports and recommendations."
