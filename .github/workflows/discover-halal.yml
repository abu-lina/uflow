# .github/workflows/discover-halal.yml
#
# Halal Discovery Pipeline (Plan 225)
# Sweeps Wolt for halal restaurants in German cities, deduplicates against
# existing providers, and imports new ones as pending. This finds new providers;
# enrich-halal-compliance.yml screens existing ones. Lieferando discovery was
# removed in #830 (blocked by Cloudflare since #828).
#
# Triggers:
#   - Weekly schedule (Monday 06:00 UTC) in dry-run mode
#   - Manual dispatch with configurable mode, limit, environment
#
# Usage:
#   1. Go to Actions > "Halal Discovery Pipeline"
#   2. Click "Run workflow"
#   3. Choose mode, limit, and environment
#   4. Review output in the workflow logs + step summary
#
# Security:
#   - Uses SUPABASE_SERVICE_ROLE_KEY from GitHub Secrets (never exposed in logs)
#   - Dry-run is the default to prevent unintended writes
#   - Scheduled runs are always dry-run

name: Halal Discovery Pipeline

permissions:
  contents: read

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - write
      limit:
        description: 'City limit (blank = all cities)'
        required: false
        type: string
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - uat

jobs:
  discover-wolt:
    name: "Wolt Discovery (${{ inputs.mode || 'dry-run' }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI arguments
        id: args
        env:
          INPUT_MODE: ${{ inputs.mode || 'dry-run' }}
          INPUT_LIMIT: ${{ inputs.limit || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          MODE="$INPUT_MODE"
          LIMIT="$INPUT_LIMIT"

          if [ "$MODE" = "write" ] && [ "$EVENT_NAME" != "schedule" ]; then
            ARGS="--write"
          else
            ARGS="--dry-run"
          fi

          if [ -n "$LIMIT" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi

          echo "cli_args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run Wolt discovery
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          CLI_ARGS: ${{ steps.args.outputs.cli_args }}
        run: |
          echo "Running Wolt discovery against $INPUT_ENVIRONMENT"
          echo "  Args: $CLI_ARGS"
          echo ""
          npx tsx scripts/discover-wolt.ts $CLI_ARGS

      - name: Step summary
        if: always()
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          INPUT_MODE: ${{ inputs.mode || 'dry-run' }}
          CLI_ARGS: ${{ steps.args.outputs.cli_args }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "## Wolt Discovery" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Wolt |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | $INPUT_ENVIRONMENT |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | $INPUT_MODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Args | \`$CLI_ARGS\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | $ACTOR ($EVENT_NAME) |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY
          if [ "$INPUT_MODE" = "write" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Records inserted with \`review_status = 'pending'\`. Approve via admin moderation." >> $GITHUB_STEP_SUMMARY
          fi
