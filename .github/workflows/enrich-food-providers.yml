# #830 review: the enrich-delivery-menus.ts step here and enrich-halal-compliance.yml overlap on
# menu fetching but both stay. This workflow persists menus to food_menu and fills provider data
# (menus, delivery links) for every source. enrich-halal-compliance.yml only stages no_alcohol /
# no_pork candidates from menu text and writes nothing to food_menu.

name: Food Provider Enrichment

permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly Sunday 3am UTC
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources to run (comma-separated: wolt,lieferando,ubereats,joinhalal)'
        required: false
        default: 'wolt,lieferando,ubereats,joinhalal'
        type: string
      mode:
        description: 'Execution mode'
        required: true
        default: 'auto-apply'
        type: choice
        options:
          - auto-apply
          - dry-run
          - write
      limit:
        description: 'Max providers per source (blank = all)'
        required: false
        default: ''
        type: string
      provider-id:
        description: 'Single provider ID to enrich (skips per-source enrichment)'
        required: false
        default: ''
        type: string

jobs:
  enrich:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve sources (supports schedule + workflow_dispatch)
        id: resolve-sources
        env:
          INPUT_SOURCES: ${{ github.event.inputs.sources }}
        run: |
          echo "resolved_sources=${INPUT_SOURCES:-wolt,lieferando,ubereats,joinhalal}" >> "$GITHUB_OUTPUT"

      - name: Install Playwright Chromium
        if: contains(steps.resolve-sources.outputs.resolved_sources, 'ubereats') || contains(steps.resolve-sources.outputs.resolved_sources, 'lieferando')
        run: npx playwright install chromium --with-deps

      - name: Run enrichment sources
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESOLVED_SOURCES: ${{ steps.resolve-sources.outputs.resolved_sources }}
          INPUT_MODE: ${{ github.event.inputs.mode || 'auto-apply' }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_PROVIDER_ID: ${{ github.event.inputs.provider-id }}
        run: |
          set +e
          SOURCES="$RESOLVED_SOURCES"
          MODE="$INPUT_MODE"
          LIMIT="$INPUT_LIMIT"
          if [ -n "$INPUT_PROVIDER_ID" ]; then
            SOURCES="none"
          fi
          mkdir -p /tmp/enrichment-logs
          for SOURCE in joinhalal wolt lieferando ubereats; do
            if echo "$SOURCES" | grep -qw "$SOURCE"; then
              echo ""
              echo "═══════════════════════════════════════════════"
              echo "  ▶️  Running source: $SOURCE"
              echo "═══════════════════════════════════════════════"
              ARGS="--source $SOURCE --mode $MODE"
              if [ -n "$LIMIT" ]; then
                ARGS="$ARGS --limit $LIMIT"
              fi
              npx tsx scripts/enrich-providers.ts $ARGS > "/tmp/enrichment-logs/${SOURCE}.log" 2>&1
              RC=$?
              cat "/tmp/enrichment-logs/${SOURCE}.log"
              if [ $RC -ne 0 ]; then
                echo "  ⚠️  Source $SOURCE failed (exit $RC) — continuing"
              else
                echo "  ✅ Source $SOURCE complete"
              fi
            fi
          done
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "  ✅ All enrichment sources complete"
          echo "═══════════════════════════════════════════════"

      - name: Install Playwright for delivery menu enrichment
        if: always()
        run: npx playwright install chromium --with-deps

      - name: Run delivery menu enrichment (URL-based)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          INPUT_PROVIDER_ID: ${{ github.event.inputs.provider-id }}
        run: |
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "  ▶️  Running delivery menu enrichment"
          echo "═══════════════════════════════════════════════"
          DM_ARGS=""
          if [ -n "$INPUT_PROVIDER_ID" ]; then
            DM_ARGS="--provider-id $INPUT_PROVIDER_ID"
          fi
          npx tsx scripts/enrich-delivery-menus.ts $DM_ARGS > "/tmp/enrichment-logs/delivery-menus.log" 2>&1
          RC=$?
          cat "/tmp/enrichment-logs/delivery-menus.log"
          if [ $RC -ne 0 ]; then
            echo "  ⚠️  Delivery menu enrichment completed with warnings (exit $RC)"
          else
            echo "  ✅ Delivery menu enrichment complete"
          fi
          echo "═══════════════════════════════════════════════"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enrichment-logs-${{ github.run_id }}
          path: /tmp/enrichment-logs/
          retention-days: 30
