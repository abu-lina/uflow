name: Deploy to UAT

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-uat:
    name: Build & Deploy to UAT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify required secrets
        run: |
          set -e
          
          # Function to trim whitespace
          trim() {
            local var="$*"
            var="${var#"${var%%[![:space:]]*}"}"  # remove leading whitespace
            var="${var%"${var##*[![:space:]]}"}"  # remove trailing whitespace
            echo -n "$var"
          }
          
          # Check for UAT-specific secrets first, then fall back to production secrets
          UAT_URL_RAW="${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_URL }}"
          UAT_KEY_RAW="${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          
          # Trim whitespace
          UAT_URL=$(trim "$UAT_URL_RAW")
          UAT_KEY=$(trim "$UAT_KEY_RAW")
          
          # Debug: Check if secrets exist (even if empty)
          echo "🔍 Checking secrets..."
          if [ -n "$UAT_URL_RAW" ]; then
            echo "   ✓ UAT_NEXT_PUBLIC_SUPABASE_URL exists (length: ${#UAT_URL_RAW})"
          else
            echo "   ✗ UAT_NEXT_PUBLIC_SUPABASE_URL not found or empty"
          fi
          
          if [ -n "$UAT_KEY_RAW" ]; then
            echo "   ✓ UAT_NEXT_PUBLIC_SUPABASE_ANON_KEY exists (length: ${#UAT_KEY_RAW})"
          else
            echo "   ✗ UAT_NEXT_PUBLIC_SUPABASE_ANON_KEY not found or empty"
          fi
          
          # Fallback to production secrets if UAT secrets are not set or empty
          if [ -z "$UAT_URL" ]; then
            echo "⚠️ UAT_NEXT_PUBLIC_SUPABASE_URL not found or empty, trying NEXT_PUBLIC_SUPABASE_URL"
            PROD_URL_RAW="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
            UAT_URL=$(trim "$PROD_URL_RAW")
            if [ -n "$UAT_URL" ]; then
              echo "   ✓ Using NEXT_PUBLIC_SUPABASE_URL"
            fi
          fi
          
          if [ -z "$UAT_KEY" ]; then
            echo "⚠️ UAT_NEXT_PUBLIC_SUPABASE_ANON_KEY not found or empty, trying NEXT_PUBLIC_SUPABASE_ANON_KEY"
            PROD_KEY_RAW="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
            UAT_KEY=$(trim "$PROD_KEY_RAW")
            if [ -n "$UAT_KEY" ]; then
              echo "   ✓ Using NEXT_PUBLIC_SUPABASE_ANON_KEY"
            fi
          fi
          
          # Validate URL is present and not empty
          if [ -z "$UAT_URL" ]; then
            echo ""
            echo "❌ Error: Supabase URL is missing or empty"
            echo "   Required: UAT_NEXT_PUBLIC_SUPABASE_URL or NEXT_PUBLIC_SUPABASE_URL"
            echo "   Please add one of these secrets in: Settings → Secrets and variables → Actions"
            echo "   Format: https://<project-ref>.supabase.co"
            exit 1
          fi
          
          # Validate KEY is present and not empty
          if [ -z "$UAT_KEY" ]; then
            echo ""
            echo "❌ Error: Supabase anon key is missing or empty"
            echo "   Required: UAT_NEXT_PUBLIC_SUPABASE_ANON_KEY or NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "   Please add one of these secrets in: Settings → Secrets and variables → Actions"
            echo "   Format: JWT token starting with 'eyJ'"
            exit 1
          fi
          
          # Validate URL format (basic check)
          if [[ ! "$UAT_URL" =~ ^https://.*\.supabase\.co$ ]]; then
            echo ""
            echo "❌ Error: Supabase URL has invalid format"
            echo "   Current value: '$UAT_URL'"
            echo "   Length: ${#UAT_URL} characters"
            echo "   Expected format: https://<project-ref>.supabase.co"
            echo "   Example: https://abcdefghijklmnop.supabase.co"
            echo ""
            echo "   Common issues:"
            echo "   - Trailing slash: https://xxx.supabase.co/ ❌"
            echo "   - Missing https://"
            echo "   - Wrong domain (should end with .supabase.co)"
            exit 1
          fi
          
          # Validate KEY format (must be JWT starting with eyJ)
          if [[ ! "$UAT_KEY" =~ ^eyJ ]]; then
            echo ""
            echo "❌ Error: Supabase anon key has invalid format"
            echo "   Current value starts with: '${UAT_KEY:0:20}...'"
            echo "   Length: ${#UAT_KEY} characters"
            echo "   Expected: JWT token starting with 'eyJ' (usually 200+ characters)"
            echo ""
            echo "   Common issues:"
            echo "   - Key is truncated or incomplete"
            echo "   - Wrong key type (should be 'anon' key, not 'service_role')"
            echo "   - Extra whitespace or newlines"
            echo "   - Key copied incorrectly"
            exit 1
          fi
          
          echo ""
          echo "✅ Required secrets are present and valid"
          echo "   Using Supabase URL: ${UAT_URL:0:40}..."
          echo "   Using anon key: ${UAT_KEY:0:30}..."
      
      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/uflow-uat:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=https://uat.ummahflow.com
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.UAT_NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_FEATURE_ISAPPLAUNCHED=${{ secrets.UAT_NEXT_PUBLIC_FEATURE_ISAPPLAUNCHED || secrets.NEXT_PUBLIC_FEATURE_ISAPPLAUNCHED }}
            DISABLE_PWA=false
          platforms: linux/amd64
      
      - name: Upload Nginx config to Hetzner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "nginx-uat-template.conf"
          target: "/tmp/"
      
      - name: Deploy to UAT on Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /tmp
            
            # Store old container ID for rollback
            OLD_CONTAINER=$(docker ps -q -f name=uflow-uat) || true
            
            echo "🛑 Stopping old UAT container..."
            docker stop uflow-uat || true
            docker rm uflow-uat || true
            
            echo "📦 Pulling new UAT image from GHCR..."
            IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/uflow-uat:latest"
            
            # Use PAT if available, otherwise try GITHUB_TOKEN (may need package:read permission)
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "🔐 Logging in to GHCR with PAT..."
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            else
              echo "⚠️ GHCR_PAT not found, trying GITHUB_TOKEN (may not work for private repos)"
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            fi
            
            echo "🔍 Attempting to pull: $IMAGE_NAME"
            if ! docker pull "$IMAGE_NAME"; then
              echo ""
              echo "❌ Failed to pull image from GHCR"
              echo "   Image: $IMAGE_NAME"
              echo ""
              echo "   Possible causes:"
              echo "   1. Image doesn't exist yet (build step may have failed)"
              echo "   2. GHCR_PAT token doesn't have 'read:packages' permission"
              echo "   3. Package visibility is set to private and token can't access it"
              echo ""
              echo "   Solutions:"
              echo "   - Check if the 'Build and push Docker image to GHCR' step succeeded"
              echo "   - Verify GHCR_PAT has 'read:packages' permission"
              echo "   - Check package visibility at: https://github.com/${{ github.repository_owner }}?tab=packages"
              echo ""
              exit 1
            fi
            echo "✅ Image pulled successfully"
            
            echo "🚀 Starting new UAT container on port 3001..."
            NEW_CONTAINER=$(docker run -d -p 3001:3000 \
              -e NEXT_PUBLIC_SUPABASE_URL="${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              -e NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.UAT_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -e RESEND_API_KEY="${{ secrets.UAT_RESEND_API_KEY || secrets.RESEND_API_KEY }}" \
              -e NEXT_PUBLIC_SITE_URL="https://uat.ummahflow.com" \
              -e NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ secrets.UAT_NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
              -e TURNSTILE_SECRET_KEY="${{ secrets.UAT_TURNSTILE_SECRET_KEY || secrets.TURNSTILE_SECRET_KEY }}" \
              -e TEST_API_KEY="${{ secrets.UAT_TEST_API_KEY || secrets.TEST_API_KEY }}" \
              -e DISABLE_PWA=false \
              --name uflow-uat \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/uflow-uat:latest)
            
            echo "⏳ Waiting for UAT app to start..."
            sleep 10
            
            echo "🏥 UAT health check..."
            HEALTH_CHECK_FAILED=true
            for i in {1..30}; do
                if curl -f http://localhost:3001/api/health > /dev/null 2>&1; then
                    echo "✅ UAT app is healthy"
                    HEALTH_CHECK_FAILED=false
                    break
                fi
                echo "Health check attempt $i/30..."
                sleep 2
            done
            
            if [ "$HEALTH_CHECK_FAILED" = "true" ]; then
                echo "❌ UAT health check failed - rolling back..."
                docker logs --tail 50 uflow-uat
                docker stop uflow-uat || true
                docker rm uflow-uat || true
                if [ -n "$OLD_CONTAINER" ]; then
                    echo "🔄 Restarting old container..."
                    docker start $OLD_CONTAINER || true
                fi
                exit 1
            fi
            
            echo "🔧 Updating Nginx for UAT..."
            if [ -f "/tmp/nginx-uat-template.conf" ]; then
                cp /tmp/nginx-uat-template.conf /etc/nginx/sites-available/uat-ummahflow
                ln -sf /etc/nginx/sites-available/uat-ummahflow /etc/nginx/sites-enabled/uat-ummahflow
            else
                echo "⚠️ nginx-uat-template.conf not found, skipping Nginx update"
            fi
            
            echo "🧪 Testing Nginx config..."
            if nginx -t; then
                systemctl reload nginx
                echo "✅ Nginx reloaded for UAT"
            else
                echo "❌ Nginx config invalid"
                exit 1
            fi
            
            echo "🌐 Verifying UAT deployment..."
            sleep 3
            if curl -f https://uat.ummahflow.com/api/health > /dev/null 2>&1; then
                echo "✅ UAT deployment successful!"
            else
                echo "⚠️ UAT health check through domain failed (may need DNS/SSL setup)"
            fi
            
            echo "🎉 UAT deployment complete!"
      
      - name: UAT deployment summary
        if: success()
        run: |
          echo "## ✅ UAT Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**UAT URL:** https://uat.ummahflow.com" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check:** https://uat.ummahflow.com/api/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 UAT is now live! Production deployment will proceed next." >> $GITHUB_STEP_SUMMARY

