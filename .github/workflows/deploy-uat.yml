name: Deploy to UAT

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy-uat:
    name: Build & Deploy to UAT
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check nginx config changed
        id: nginx-check
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            if git diff --name-only HEAD~1 HEAD | grep -q 'deploy/nginx/nginx-uat-template.conf'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload Nginx config to Hetzner
        if: steps.nginx-check.outputs.changed == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: 'deploy/nginx/nginx-uat-template.conf'
          target: '/tmp/'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify required secrets
        run: |
          set -e
          UAT_URL="${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          UAT_KEY="${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          [[ -z "$UAT_URL" ]] && echo "❌ Missing SUPABASE_URL" && exit 1
          [[ ! "$UAT_URL" =~ ^https://.*\.supabase\.co$ ]] && echo "❌ Invalid SUPABASE_URL format" && exit 1
          [[ -z "$UAT_KEY" ]] && echo "❌ Missing SUPABASE_ANON_KEY" && exit 1
          [[ ! "$UAT_KEY" =~ ^eyJ ]] && echo "❌ Invalid SUPABASE_ANON_KEY format" && exit 1
          echo "✅ Secrets validated"

      - name: Validate npm ci (pre-Docker sanity check)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Run npm ci
        run: npm ci --no-audit

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/uflow-uat:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=https://uat.ummahflow.com
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.UAT_NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_FEATURE_ISAPPLAUNCHED=${{ secrets.UAT_NEXT_PUBLIC_FEATURE_ISAPPLAUNCHED || secrets.NEXT_PUBLIC_FEATURE_ISAPPLAUNCHED }}
            DISABLE_PWA=false
          platforms: linux/amd64

      - name: Deploy to UAT on Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /tmp

            # Blue-green deployment: Start new container on temp port, verify, then swap
            OLD_CONTAINER=$(docker ps -q -f name=uflow-uat) || true

            echo "📦 Pulling new UAT image from GHCR..."
            IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/uflow-uat:latest"

            # Use PAT if available, otherwise try GITHUB_TOKEN (may need package:read permission)
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "🔐 Logging in to GHCR with PAT..."
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            else
              echo "⚠️ GHCR_PAT not found, trying GITHUB_TOKEN (may not work for private repos)"
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            fi

            echo "🔍 Attempting to pull: $IMAGE_NAME"
            if ! docker pull "$IMAGE_NAME"; then
              echo ""
              echo "❌ Failed to pull image from GHCR"
              echo "   Image: $IMAGE_NAME"
              echo ""
              echo "   Possible causes:"
              echo "   1. Image doesn't exist yet (build step may have failed)"
              echo "   2. GHCR_PAT token doesn't have 'read:packages' permission"
              echo "   3. Package visibility is set to private and token can't access it"
              echo ""
              echo "   Solutions:"
              echo "   - Check if the 'Build and push Docker image to GHCR' step succeeded"
              echo "   - Verify GHCR_PAT has 'read:packages' permission"
              echo "   - Check package visibility at: https://github.com/${{ github.repository_owner }}?tab=packages"
              echo ""
              exit 1
            fi
            echo "✅ Image pulled successfully"

            echo "🚀 Starting new UAT container on temporary port 3003 (blue-green deployment)..."
            NEW_CONTAINER=$(docker run -d -p 3003:3000 \
              -e NEXT_PUBLIC_SUPABASE_URL="${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              -e NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.UAT_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -e RESEND_API_KEY="${{ secrets.UAT_RESEND_API_KEY || secrets.RESEND_API_KEY }}" \
              -e NEXT_PUBLIC_SITE_URL="https://uat.ummahflow.com" \
              -e NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ secrets.UAT_NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
              -e TURNSTILE_SECRET_KEY="${{ secrets.UAT_TURNSTILE_SECRET_KEY || secrets.TURNSTILE_SECRET_KEY }}" \
              -e TEST_API_KEY="${{ secrets.UAT_TEST_API_KEY || secrets.TEST_API_KEY }}" \
              -e DISABLE_PWA=false \
              --name uflow-uat-new \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/uflow-uat:latest)

            echo "⏳ Waiting for new UAT container to start..."
            sleep 3

            echo "🏥 Health check on new UAT container (port 3003)..."
            HEALTH_CHECK_FAILED=true
            for i in {1..20}; do
                if curl -f http://localhost:3003/api/health > /dev/null 2>&1; then
                    echo "✅ New UAT container is healthy"
                    HEALTH_CHECK_FAILED=false
                    break
                fi
                echo "Health check attempt $i/20..."
                sleep 1
            done

            if [ "$HEALTH_CHECK_FAILED" = "true" ]; then
                echo "❌ Health check failed on new UAT container - cleaning up..."
                docker logs --tail 50 uflow-uat-new
                docker stop uflow-uat-new || true
                docker rm uflow-uat-new || true
                exit 1
            fi

            echo "🔄 Swapping UAT containers (zero-downtime deployment)..."
            # Stop old container
            if [ -n "$OLD_CONTAINER" ]; then
                echo "🛑 Stopping old UAT container..."
                docker stop uflow-uat || true
                docker rm uflow-uat || true
            fi

            # Stop new container and restart on UAT port
            echo "🔄 Moving new container to UAT port 3001..."
            docker stop uflow-uat-new || true
            docker rm uflow-uat-new || true

            # Start on UAT port
            docker run -d -p 3001:3000 \
              -e NEXT_PUBLIC_SUPABASE_URL="${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              -e NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.UAT_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -e RESEND_API_KEY="${{ secrets.UAT_RESEND_API_KEY || secrets.RESEND_API_KEY }}" \
              -e NEXT_PUBLIC_SITE_URL="https://uat.ummahflow.com" \
              -e NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ secrets.UAT_NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
              -e TURNSTILE_SECRET_KEY="${{ secrets.UAT_TURNSTILE_SECRET_KEY || secrets.TURNSTILE_SECRET_KEY }}" \
              -e TEST_API_KEY="${{ secrets.UAT_TEST_API_KEY || secrets.TEST_API_KEY }}" \
              -e DISABLE_PWA=false \
              --name uflow-uat \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/uflow-uat:latest

            echo "✅ UAT container swap complete"

            echo "🔧 Updating Nginx for UAT..."
            if [ -f "/tmp/nginx-uat-template.conf" ]; then
                cp /tmp/nginx-uat-template.conf /etc/nginx/sites-available/uat-ummahflow
                ln -sf /etc/nginx/sites-available/uat-ummahflow /etc/nginx/sites-enabled/uat-ummahflow
            else
                echo "⚠️ nginx-uat-template.conf not found, skipping Nginx update"
            fi

            echo "🧪 Testing Nginx config..."
            if nginx -t; then
                systemctl reload nginx
                echo "✅ Nginx reloaded for UAT"
            else
                echo "❌ Nginx config invalid"
                exit 1
            fi

            echo "🌐 Verifying UAT deployment..."
            sleep 3
            if curl -f https://uat.ummahflow.com/api/health > /dev/null 2>&1; then
                echo "✅ UAT deployment successful!"
            else
                echo "⚠️ UAT health check through domain failed (may need DNS/SSL setup)"
            fi

            echo "🎉 UAT deployment complete!"

      - name: UAT deployment summary
        if: success()
        run: |
          echo "## ✅ UAT Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**UAT URL:** https://uat.ummahflow.com" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check:** https://uat.ummahflow.com/api/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 UAT is now live! Production deployment will proceed next." >> $GITHUB_STEP_SUMMARY
