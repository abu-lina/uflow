name: Weekly Quality Gates

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # Performance & Accessibility with Lighthouse
  lighthouse-audit:
    name: Lighthouse Performance & Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build application
        run: npx next build

      - name: Start application
        run: npx next start &
        env:
          PORT: 3000

      - name: Wait for app
        run: |
          timeout=60
          while ! curl -f http://localhost:3000 > /dev/null 2>&1; do
            [ $timeout -le 0 ] && exit 1
            timeout=$((timeout - 1))
            sleep 1
          done

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.12.x
          cat > lighthouserc.json << 'EOF'
          {
            "ci": {
              "collect": {
                "url": ["http://localhost:3000", "http://localhost:3000/providers"],
                "numberOfRuns": 3
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", {"minScore": 0.7}],
                  "categories:accessibility": ["error", {"minScore": 0.9}],
                  "categories:best-practices": ["warn", {"minScore": 0.8}],
                  "categories:seo": ["warn", {"minScore": 0.8}]
                }
              },
              "upload": {
                "target": "temporary-public-storage"
              }
            }
          }
          EOF
          lhci autorun --config=lighthouserc.json || echo "⚠️ Lighthouse audit completed with warnings"

      - name: Stop application
        if: always()
        run: pkill -f "next start" || true

  # Deep security scanning
  security-scan:
    name: Deep Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: npm audit
        run: |
          npm audit --audit-level=moderate --json > audit-report.json || true
          npm audit --audit-level=high || echo "⚠️ High severity vulnerabilities found"

      - name: Snyk security scan
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

      - name: Code security checks
        run: |
          echo "## 🔒 Security Analysis" > security-report.md
          echo "" >> security-report.md
          
          # Check for potential issues
          echo "### Security Checks:" >> security-report.md
          
          if grep -r "password.*=.*['\"]" src/ 2>/dev/null | grep -v node_modules | grep -v ".git"; then
            echo "⚠️ Potential hardcoded passwords found" >> security-report.md
          else
            echo "✅ No hardcoded passwords" >> security-report.md
          fi
          
          if grep -r "eval(" src/ 2>/dev/null | grep -v node_modules | grep -v ".git"; then
            echo "⚠️ eval() usage detected" >> security-report.md
          else
            echo "✅ No eval() usage" >> security-report.md
          fi
          
          if grep -r "dangerouslySetInnerHTML" src/ 2>/dev/null | grep -v node_modules | grep -v ".git"; then
            echo "⚠️ dangerouslySetInnerHTML usage detected" >> security-report.md
          else
            echo "✅ No dangerouslySetInnerHTML usage" >> security-report.md
          fi

      - name: Upload security report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports
          path: |
            audit-report.json
            security-report.md
          retention-days: 30

  # Dependency analysis
  dependency-check:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Check for outdated packages
        run: |
          npm outdated > outdated-packages.txt || true
          echo "## 📦 Outdated Packages" > dependency-report.md
          cat outdated-packages.txt >> dependency-report.md

      - name: Check for unused dependencies
        run: |
          npx depcheck >> dependency-report.md || echo "⚠️ Depcheck completed with warnings"

      - name: Upload dependency report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-report
          path: dependency-report.md
          retention-days: 30

  # Bundle size analysis
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build and analyze
        run: |
          npx next build
          echo "## 📦 Bundle Size Analysis" > bundle-report.md
          echo "" >> bundle-report.md
          du -sh .next >> bundle-report.md
          echo "" >> bundle-report.md
          echo "### Largest Files:" >> bundle-report.md
          find .next -name "*.js" -exec du -h {} \; | sort -rh | head -20 >> bundle-report.md

      - name: Upload bundle report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-analysis
          path: bundle-report.md
          retention-days: 30

  # Summary
  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [lighthouse-audit, security-scan, dependency-check, bundle-analysis]
    if: always()
    timeout-minutes: 3
    
    steps:
      - name: Generate report
        run: |
          echo "## 🎯 Weekly Quality Gates Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse Audit | ${{ needs.lighthouse-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Check | ${{ needs.dependency-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle Analysis | ${{ needs.bundle-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Check artifacts for detailed reports" >> $GITHUB_STEP_SUMMARY
          echo "🔄 Runs weekly on Sundays at 2 AM UTC" >> $GITHUB_STEP_SUMMARY
