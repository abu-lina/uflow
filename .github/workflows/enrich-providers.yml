# .github/workflows/enrich-providers.yml
#
# Provider Enrichment Pipeline — Plan 065
# Re-fetches approved ownerless providers' source pages and stages enrichment
# candidates for admin review.
#
# Usage:
#   1. Go to Actions → "Provider Enrichment Pipeline"
#   2. Click "Run workflow"
#   3. Choose mode (dry-run/write), source, limit, and environment
#   4. Review output in the workflow logs
#
# Candidates are staged in enrichment_candidates with status='pending'.
# Approve/reject via the admin API or Supabase Dashboard.
#
# Security:
#   - Uses SUPABASE_SERVICE_ROLE_KEY from GitHub Secrets (never exposed in logs)
#   - Requires manual trigger (workflow_dispatch) — no accidental runs
#   - Dry-run is the default to prevent unintended writes

name: Provider Enrichment Pipeline

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - write
          - auto-apply
      source:
        description: 'Enrichment source'
        required: true
        default: 'joinhalal'
        type: choice
        options:
          - joinhalal
          - wolt-direct
      limit:
        description: 'Provider limit'
        required: true
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '50'
          - '100'
          - 'all'
      environment:
        description: 'Target environment'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - production

jobs:
  enrich:
    name: 'enrich (${{ inputs.mode }}, ${{ inputs.source }}, limit=${{ inputs.limit }}, ${{ inputs.environment }})'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI arguments
        id: args
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_SOURCE: ${{ inputs.source }}
        run: |
          MODE="$INPUT_MODE"
          LIMIT="$INPUT_LIMIT"

          if [ "$MODE" = "write" ]; then
            CLI_ARGS="--write --source $INPUT_SOURCE"
          elif [ "$MODE" = "auto-apply" ]; then
            CLI_ARGS="--mode auto-apply --source $INPUT_SOURCE"
          else
            CLI_ARGS="--dry-run --source $INPUT_SOURCE"
          fi

          if [ "$LIMIT" != "all" ]; then
            CLI_ARGS="$CLI_ARGS --limit $LIMIT"
          fi

          echo "cli_args=$CLI_ARGS" >> "$GITHUB_OUTPUT"

      - name: Run enrichment
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIMIT: ${{ inputs.limit }}
          CLI_ARGS: ${{ steps.args.outputs.cli_args }}
        run: |
          echo "🚀 Running Provider Enrichment against $INPUT_ENVIRONMENT"
          echo "   Source: $INPUT_SOURCE"
          echo "   Mode:   $INPUT_MODE"
          echo "   Limit:  $INPUT_LIMIT"
          echo "   Args:   $CLI_ARGS"
          echo ""
          npx tsx scripts/enrich-providers.ts $CLI_ARGS

      - name: Summary
        env:
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIMIT: ${{ inputs.limit }}
          CLI_ARGS: ${{ steps.args.outputs.cli_args }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "## Provider Enrichment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Source | $INPUT_SOURCE |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | $INPUT_ENVIRONMENT |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | $INPUT_MODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Limit | $INPUT_LIMIT |" >> $GITHUB_STEP_SUMMARY
          echo "| Args | \`$CLI_ARGS\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | $ACTOR |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY
          if [ "$INPUT_MODE" = "write" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Candidates staged with \`status = 'pending'\`**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Review and approve via:" >> $GITHUB_STEP_SUMMARY
            echo "- Admin API: \`GET /api/admin/enrichment/candidates\`" >> $GITHUB_STEP_SUMMARY
            echo "- Supabase Dashboard → Table Editor → \`enrichment_candidates\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$INPUT_MODE" = "dry-run" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️ **Dry-run mode — no data was written.** Review the logs above for proposed changes." >> $GITHUB_STEP_SUMMARY
          fi
