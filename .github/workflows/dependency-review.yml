# Dependency Review Workflow
# Automatically reviews dependency changes in PRs and blocks vulnerable dependencies.
#
# Uses GitHub's dependency-review-action to scan for:
# - Known vulnerabilities in new/updated dependencies
# - License compliance issues (optional, not configured here)
#
# Reference: https://github.com/actions/dependency-review-action

name: Dependency Review

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Dependency Review
        # Pinned to v4.6.0 SHA for supply chain security (per critique L2)
        # Check for updates: https://github.com/actions/dependency-review-action/releases
        uses: actions/dependency-review-action@4081bf99e2866ebe428571c5e1f4bf24092ce0ff # v4.6.0
        with:
          # Fail on high and critical severity vulnerabilities
          fail-on-severity: high
          # Allow dependencies with these licenses (common open-source)
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, Unlicense
          # Comment on PR with findings
          comment-summary-in-pr: always
