name: Performance Monitoring & Regression Detection

on:
  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allow manual triggering
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'next.config.*'
      - 'tailwind.config.*'

jobs:
  # Lighthouse Performance Tests
  lighthouse:
    name: Lighthouse Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm start &
        env:
          NODE_ENV: test
          PORT: 3000

      - name: Wait for app to be ready
        run: |
          timeout=120
          while ! curl -f http://localhost:3000 > /dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "Application failed to start within 120 seconds"
              exit 1
            fi
            timeout=$((timeout - 1))
            sleep 1
          done

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x

      - name: Run Lighthouse CI
        run: |
          # Create lighthouse config
          cat > lighthouserc.json << EOF
          {
            "ci": {
              "collect": {
                "url": [
                  "http://localhost:3000",
                  "http://localhost:3000/souks",
                  "http://localhost:3000/profile"
                ],
                "startServerCommand": "echo 'Server already running'",
                "startServerReadyPattern": "ready",
                "startServerReadyTimeout": 10000
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", {"minScore": 0.7}],
                  "categories:accessibility": ["error", {"minScore": 0.9}],
                  "categories:best-practices": ["warn", {"minScore": 0.8}],
                  "categories:seo": ["warn", {"minScore": 0.8}]
                }
              },
              "upload": {
                "target": "temporary-public-storage"
              }
            }
          }
          EOF
          
          # Run Lighthouse CI
          lhci autorun

      - name: Stop application
        if: always()
        run: |
          pkill -f "npm start" || true
          pkill -f "next start" || true

  # Bundle Size Analysis
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Analyze bundle size
        run: |
          # Install bundle analyzer
          npm install -g @next/bundle-analyzer
          
          # Generate bundle analysis
          npx @next/bundle-analyzer build
          
          # Check for large bundles
          echo "Checking bundle sizes..."
          
          # Get bundle sizes
          bundle_sizes=$(find .next -name "*.js" -exec wc -c {} + | sort -n)
          echo "Bundle sizes:"
          echo "$bundle_sizes"
          
          # Check if any bundle is larger than 500KB
          large_bundles=$(echo "$bundle_sizes" | awk '$1 > 500000')
          if [ -n "$large_bundles" ]; then
            echo "⚠️ Warning: Large bundles detected:"
            echo "$large_bundles"
          else
            echo "✅ All bundles are within acceptable size limits"
          fi

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v3
        with:
          name: bundle-analysis
          path: .next/analyze/
          retention-days: 30

  # Core Web Vitals Monitoring
  core-web-vitals:
    name: Core Web Vitals Monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm start &
        env:
          NODE_ENV: test
          PORT: 3000

      - name: Wait for app to be ready
        run: |
          timeout=120
          while ! curl -f http://localhost:3000 > /dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "Application failed to start within 120 seconds"
              exit 1
            fi
            timeout=$((timeout - 1))
            sleep 1
          done

      - name: Test Core Web Vitals
        run: |
          echo "Testing Core Web Vitals..."
          
          # Test Largest Contentful Paint (LCP)
          echo "Testing LCP..."
          lcp_start=$(date +%s.%N)
          curl -s http://localhost:3000/ > /dev/null
          lcp_end=$(date +%s.%N)
          lcp_time=$(echo "$lcp_end - $lcp_start" | bc -l)
          echo "LCP: ${lcp_time}s"
          
          # Test First Input Delay (FID) - simulated
          echo "Testing FID..."
          fid_start=$(date +%s.%N)
          curl -s http://localhost:3000/souks > /dev/null
          fid_end=$(date +%s.%N)
          fid_time=$(echo "$fid_end - $fid_start" | bc -l)
          echo "FID: ${fid_time}s"
          
          # Test Cumulative Layout Shift (CLS) - simulated
          echo "Testing CLS..."
          cls_start=$(date +%s.%N)
          curl -s http://localhost:3000/profile > /dev/null
          cls_end=$(date +%s.%N)
          cls_time=$(echo "$cls_end - $cls_start" | bc -l)
          echo "CLS: ${cls_time}s"
          
          # Performance thresholds
          if (( $(echo "$lcp_time > 2.5" | bc -l) )); then
            echo "❌ LCP too slow: ${lcp_time}s (should be < 2.5s)"
            exit 1
          fi
          
          if (( $(echo "$fid_time > 0.1" | bc -l) )); then
            echo "❌ FID too slow: ${fid_time}s (should be < 0.1s)"
            exit 1
          fi
          
          echo "✅ Core Web Vitals within acceptable ranges"

      - name: Stop application
        if: always()
        run: |
          pkill -f "npm start" || true
          pkill -f "next start" || true

  # Performance Summary
  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [lighthouse, bundle-analysis, core-web-vitals]
    if: always()
    
    steps:
      - name: Generate performance report
        run: |
          echo "## 📊 Performance Monitoring Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Performance Test Results:" >> $GITHUB_STEP_SUMMARY
          echo "- **Lighthouse**: ${{ needs.lighthouse.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle Analysis**: ${{ needs.bundle-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Core Web Vitals**: ${{ needs.core-web-vitals.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.lighthouse.result }}" == "success" ] && \
             [ "${{ needs.bundle-analysis.result }}" == "success" ] && \
             [ "${{ needs.core-web-vitals.result }}" == "success" ]; then
            echo "🎉 **All performance tests passed!** No performance regressions detected." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some performance tests failed.** Please review the logs above." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What was monitored:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lighthouse performance scores" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Bundle size analysis" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Core Web Vitals (LCP, FID, CLS)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Accessibility and SEO scores" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Best practices compliance" >> $GITHUB_STEP_SUMMARY
