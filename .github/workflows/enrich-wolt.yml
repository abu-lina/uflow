# This workflow is kept for backward compatibility but will be removed in a future release.

name: Enrich Wolt

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max providers to process (blank = all)'
        required: false
        type: string
      dry_run:
        description: 'Dry run only (preview, no writes)'
        required: false
        type: boolean
        default: true
  # schedule: []  # Disabled — use enrich-food-providers.yml instead

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run enrichment
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event_name == 'schedule' || inputs.dry_run == true }}
          LIMIT: ${{ inputs.limit || '' }}
        run: |
          ARGS="--source wolt"
          if [ "$DRY_RUN" = "true" ]; then
            echo "ℹ️  Running in DRY RUN mode"
          else
            ARGS="$ARGS --write"
            echo "⚠️  Running in WRITE mode"
          fi
          if [ -n "$LIMIT" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          npx tsx scripts/enrich-providers.ts $ARGS

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolt-enrichment-log-${{ github.run_id }}
          path: /tmp/wolt-enrichment-*.log
          retention-days: 30
