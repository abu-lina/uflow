# .github/workflows/backfill-enrichment.yml
#
# Enrichment Backfill — fixes broken/incomplete enrichment data for existing
# providers. Manual trigger only.
#
# Fixes:
#   - Opening hours in non-canonical formats (JoinHalal wrapper, UberEats raw)
#   - Missing primary location rows
#   - NULL category_id for JoinHalal providers (re-fetches servesCuisine)
#   - Identifies names-only menus for follow-up delivery enrichment
#
# Safety:
#   - Dry-run is the default to prevent unintended writes
#   - Uses SUPABASE_SERVICE_ROLE_KEY from GitHub Secrets
#   - Requires manual trigger (workflow_dispatch)

name: Enrichment Backfill

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - write
      source:
        description: 'Provider source to backfill'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - joinhalal
          - wolt
          - lieferando
          - ubereats
      limit:
        description: 'Provider limit'
        required: true
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '50'
          - '100'
          - '500'
          - 'all'
      environment:
        description: 'Target environment'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - production

jobs:
  backfill:
    name: 'backfill (${{ inputs.mode }}, ${{ inputs.source }}, limit=${{ inputs.limit }}, ${{ inputs.environment }})'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI arguments
        id: args
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          CLI_ARGS="--mode $INPUT_MODE --source $INPUT_SOURCE"

          if [ "$INPUT_LIMIT" != "all" ]; then
            CLI_ARGS="$CLI_ARGS --limit $INPUT_LIMIT"
          fi

          echo "cli_args=$CLI_ARGS" >> "$GITHUB_OUTPUT"

      - name: Run backfill
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIMIT: ${{ inputs.limit }}
          CLI_ARGS: ${{ steps.args.outputs.cli_args }}
        run: |
          echo "Running Enrichment Backfill against $INPUT_ENVIRONMENT"
          echo "   Source: $INPUT_SOURCE"
          echo "   Mode:   $INPUT_MODE"
          echo "   Limit:  $INPUT_LIMIT"
          echo "   Args:   $CLI_ARGS"
          echo ""
          npx tsx scripts/backfill-enrichment.ts $CLI_ARGS

      - name: Summary
        env:
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIMIT: ${{ inputs.limit }}
          CLI_ARGS: ${{ steps.args.outputs.cli_args }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "## Enrichment Backfill Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Source | $INPUT_SOURCE |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | $INPUT_ENVIRONMENT |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | $INPUT_MODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Limit | $INPUT_LIMIT |" >> $GITHUB_STEP_SUMMARY
          echo "| Args | \`$CLI_ARGS\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | $ACTOR |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY
          if [ "$INPUT_MODE" = "dry-run" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Dry-run mode - no data was written.** Review the logs above for proposed changes." >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$INPUT_MODE" = "write" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Write mode - data has been modified.** Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi
