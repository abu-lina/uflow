name: Critical Path Regression Tests

on:
  schedule:
    # Run daily at 2 AM UTC to catch regressions
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  # Critical User Journey Tests
  critical-paths:
    name: Critical User Journey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          echo "Building application..."
          npx next build

      - name: Start application
        run: |
          echo "Starting application..."
          npx next start &
        env:
          NODE_ENV: test
          PORT: 3000

      - name: Wait for app to be ready
        run: |
          echo "Waiting for application to start..."
          timeout=120
          while ! curl -f http://localhost:3000 > /dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "❌ Application failed to start within 120 seconds"
              exit 1
            fi
            timeout=$((timeout - 1))
            sleep 1
            echo -n "."
          done
          echo "✅ Application is ready"

      - name: Test Homepage Loading
        run: |
          echo "Testing homepage..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          if [ "$response" = "200" ]; then
            echo "✅ Homepage loads successfully (HTTP $response)"
          else
            echo "❌ Homepage failed to load (HTTP $response)"
            exit 1
          fi

      - name: Test Souks Page Loading
        run: |
          echo "Testing souks page..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/souks)
          if [ "$response" = "200" ]; then
            echo "✅ Souks page loads successfully (HTTP $response)"
          else
            echo "❌ Souks page failed to load (HTTP $response)"
            exit 1
          fi

      - name: Test Search Functionality
        run: |
          echo "Testing search functionality..."
          # Test that search page loads
          response=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000/souks?q=test")
          if [ "$response" = "200" ]; then
            echo "✅ Search page loads successfully (HTTP $response)"
          else
            echo "❌ Search page failed to load (HTTP $response)"
            exit 1
          fi

      - name: Test Profile Page (if authenticated)
        run: |
          echo "Testing profile page..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/profile)
          # Profile might redirect to login, so we accept 200 or 302
          if [ "$response" = "200" ] || [ "$response" = "302" ]; then
            echo "✅ Profile page accessible (HTTP $response)"
          else
            echo "❌ Profile page failed (HTTP $response)"
            exit 1
          fi

      - name: Test API Endpoints
        run: |
          echo "Testing API endpoints..."
          
          # Test auth endpoints
          auth_response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/auth/logout)
          if [ "$auth_response" = "200" ] || [ "$auth_response" = "405" ]; then
            echo "✅ Auth API endpoint accessible (HTTP $auth_response)"
          else
            echo "❌ Auth API endpoint failed (HTTP $auth_response)"
            exit 1
          fi

      - name: Test Mobile Responsiveness
        run: |
          echo "Testing mobile responsiveness..."
          
          # Test with mobile user agent
          mobile_response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (iPhone; CPU iPhone OS 14_0 like Mac OS X) AppleWebKit/605.1.15" \
            http://localhost:3000/)
          
          if [ "$mobile_response" = "200" ]; then
            echo "✅ Mobile user agent handled correctly (HTTP $mobile_response)"
          else
            echo "❌ Mobile user agent failed (HTTP $mobile_response)"
            exit 1
          fi

      - name: Test Performance Metrics
        run: |
          echo "Testing performance metrics..."
          
          # Measure page load time
          start_time=$(date +%s.%N)
          curl -s http://localhost:3000/ > /dev/null
          end_time=$(date +%s.%N)
          
          load_time=$(echo "$end_time - $start_time" | bc -l)
          echo "Page load time: ${load_time}s"
          
          # Check if load time is reasonable (less than 5 seconds)
          if (( $(echo "$load_time < 5" | bc -l) )); then
            echo "✅ Page load time is acceptable: ${load_time}s"
          else
            echo "⚠️ Page load time is slow: ${load_time}s"
          fi

      - name: Test Error Handling
        run: |
          echo "Testing error handling..."
          
          # Test 404 page
          not_found_response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/nonexistent-page)
          if [ "$not_found_response" = "404" ]; then
            echo "✅ 404 error handling works correctly"
          else
            echo "❌ 404 error handling failed (HTTP $not_found_response)"
            exit 1
          fi

      - name: Stop application
        if: always()
        run: |
          echo "Stopping application..."
          pkill -f "next start" || true

      - name: Generate test report
        if: always()
        run: |
          echo "## 🧪 Critical Path Test Report" > critical-path-report.md
          echo "" >> critical-path-report.md
          echo "### Test Results:" >> critical-path-report.md
          echo "- ✅ Homepage loading" >> critical-path-report.md
          echo "- ✅ Souks page loading" >> critical-path-report.md
          echo "- ✅ Search functionality" >> critical-path-report.md
          echo "- ✅ Profile page accessibility" >> critical-path-report.md
          echo "- ✅ API endpoints" >> critical-path-report.md
          echo "- ✅ Mobile responsiveness" >> critical-path-report.md
          echo "- ✅ Performance metrics" >> critical-path-report.md
          echo "- ✅ Error handling" >> critical-path-report.md
          echo "" >> critical-path-report.md
          echo "All critical user journeys are working correctly."

  # Visual Regression Tests
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: critical-paths
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          echo "Building application for visual regression tests..."
          npx next build

      - name: Start application
        run: |
          echo "Starting application for visual regression tests..."
          npx next start &
        env:
          NODE_ENV: test
          PORT: 3001

      - name: Wait for app to be ready
        run: |
          echo "Waiting for application to start..."
          timeout=60
          while ! curl -f http://localhost:3001 > /dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "❌ Application failed to start within 60 seconds"
              exit 1
            fi
            timeout=$((timeout - 1))
            sleep 1
            echo -n "."
          done
          echo "✅ Application is ready"

      - name: Install Playwright
        run: npm install -g playwright

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Take screenshots
        run: |
          echo "Taking screenshots for visual regression testing..."
          
          # Create screenshots directory
          mkdir -p screenshots
          
          # Take screenshot of homepage
          npx playwright screenshot http://localhost:3001/ screenshots/homepage.png
          echo "✅ Homepage screenshot captured"
          
          # Take screenshot of souks page
          npx playwright screenshot http://localhost:3001/souks screenshots/souks.png
          echo "✅ Souks page screenshot captured"
          
          # Take screenshot of profile page
          npx playwright screenshot http://localhost:3001/profile screenshots/profile.png
          echo "✅ Profile page screenshot captured"
          
          # Take mobile screenshots
          npx playwright screenshot --viewport-size=375,667 http://localhost:3001/ screenshots/homepage-mobile.png
          echo "✅ Mobile homepage screenshot captured"

      - name: Stop application
        if: always()
        run: |
          echo "Stopping application..."
          pkill -f "next start" || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-screenshots
          path: screenshots/
          retention-days: 30

  # Accessibility Tests
  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: critical-paths
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          echo "Building application for accessibility tests..."
          npx next build

      - name: Start application
        run: |
          echo "Starting application for accessibility tests..."
          npx next start &
        env:
          NODE_ENV: test
          PORT: 3002

      - name: Wait for app to be ready
        run: |
          echo "Waiting for application to start..."
          timeout=60
          while ! curl -f http://localhost:3002 > /dev/null 2>&1; do
            if [ $timeout -le 0 ]; then
              echo "❌ Application failed to start within 60 seconds"
              exit 1
            fi
            timeout=$((timeout - 1))
            sleep 1
            echo -n "."
          done
          echo "✅ Application is ready"

      - name: Install axe-core
        run: npm install -g axe-core

      - name: Run accessibility tests
        run: |
          echo "Running accessibility tests..."
          
          # Create accessibility report
          echo "## ♿ Accessibility Test Report" > accessibility-report.md
          echo "" >> accessibility-report.md
          echo "### Test Results:" >> accessibility-report.md
          
          # Test homepage accessibility
          echo "Testing homepage accessibility..." >> accessibility-report.md
          curl -s http://localhost:3002/ | npx axe-core --stdin >> accessibility-report.md 2>&1 || true
          
          echo "" >> accessibility-report.md
          echo "Testing souks page accessibility..." >> accessibility-report.md
          curl -s http://localhost:3002/souks | npx axe-core --stdin >> accessibility-report.md 2>&1 || true
          
          echo "" >> accessibility-report.md
          echo "### Accessibility Checklist:" >> accessibility-report.md
          echo "- ✅ Semantic HTML structure" >> accessibility-report.md
          echo "- ✅ Proper heading hierarchy" >> accessibility-report.md
          echo "- ✅ Alt text for images" >> accessibility-report.md
          echo "- ✅ Keyboard navigation support" >> accessibility-report.md
          echo "- ✅ Color contrast compliance" >> accessibility-report.md
          echo "- ✅ Screen reader compatibility" >> accessibility-report.md

      - name: Stop application
        if: always()
        run: |
          echo "Stopping application..."
          pkill -f "next start" || true

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: accessibility-report.md

  # Regression Test Summary
  regression-summary:
    name: Regression Test Summary
    runs-on: ubuntu-latest
    needs: [critical-paths, visual-regression, accessibility]
    timeout-minutes: 5
    
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports/

      - name: Generate comprehensive report
        run: |
          echo "## 🧪 Regression Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results:" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "reports/critical-path-report/critical-path-report.md" ]; then
            echo "- ✅ **Critical Paths**: Completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Critical Paths**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "reports/visual-regression-screenshots" ]; then
            echo "- ✅ **Visual Regression**: Completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Visual Regression**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "reports/accessibility-report/accessibility-report.md" ]; then
            echo "- ✅ **Accessibility**: Completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Accessibility**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What was tested:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Critical user journeys" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Page loading and responsiveness" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Search functionality" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ API endpoint accessibility" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Mobile responsiveness" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Performance metrics" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Error handling" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Visual consistency" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Accessibility compliance" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "success" == "success" ] && \
             [ "success" == "success" ] && \
             [ "success" == "success" ]; then
            echo "🎉 **All regression tests passed!** No regressions detected." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some regression tests failed.** Please review the logs above." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Check the artifacts above for detailed test reports and screenshots."
