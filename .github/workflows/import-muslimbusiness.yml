# .github/workflows/import-muslimbusiness.yml
#
# MuslimBusiness Provider Data Import (Plan 052)
# Runs the import script against Supabase using GitHub Secrets.
#
# Usage:
#   1. Go to Actions → "Import MuslimBusiness Providers"
#   2. Click "Run workflow"
#   3. Choose mode (dry-run or write) and limit
#   4. Review output in the workflow logs
#
# Security:
#   - Uses SUPABASE_SERVICE_ROLE_KEY from GitHub Secrets (never exposed in logs)
#   - Requires manual trigger (workflow_dispatch) — no accidental runs
#   - Dry-run is the default to prevent unintended writes

name: Import MuslimBusiness Providers

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Import mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - write
      limit:
        description: 'Number of providers to process (10, 50, 100, all)'
        required: true
        default: '50'
        type: choice
        options:
          - '10'
          - '50'
          - '100'
          - 'all'
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - uat

jobs:
  import:
    name: Import Providers (${{ inputs.mode }}, limit=${{ inputs.limit }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run import (Production)
        if: inputs.environment == 'production'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🚀 Running MuslimBusiness import against PRODUCTION"
          echo "   Mode: ${{ inputs.mode }}"
          echo "   Limit: ${{ inputs.limit }}"
          echo ""

          if [ "${{ inputs.limit }}" = "all" ]; then
            npx tsx scripts/import-muslimbusiness.ts --${{ inputs.mode }}
          else
            npx tsx scripts/import-muslimbusiness.ts --${{ inputs.mode }} --limit ${{ inputs.limit }}
          fi

      - name: Run import (UAT)
        if: inputs.environment == 'uat'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.UAT_NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UAT_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🚀 Running MuslimBusiness import against UAT"
          echo "   Mode: ${{ inputs.mode }}"
          echo "   Limit: ${{ inputs.limit }}"
          echo ""

          if [ "${{ inputs.limit }}" = "all" ]; then
            npx tsx scripts/import-muslimbusiness.ts --${{ inputs.mode }}
          else
            npx tsx scripts/import-muslimbusiness.ts --${{ inputs.mode }} --limit ${{ inputs.limit }}
          fi

      - name: Summary
        run: |
          echo "## Import Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | ${{ inputs.mode }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Limit | ${{ inputs.limit }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.mode }}" = "write" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Records inserted with \`review_status = 'pending'\`**" >> $GITHUB_STEP_SUMMARY
            echo "Imported cohort query:" >> $GITHUB_STEP_SUMMARY
            echo "\`SELECT * FROM providers WHERE user_created_id = '00000000-0000-0000-0000-000052000001';\`" >> $GITHUB_STEP_SUMMARY
          fi
