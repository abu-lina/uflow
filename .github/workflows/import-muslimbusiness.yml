# .github/workflows/import-muslimbusiness.yml
#
# MuslimBusiness Provider Data Import (Plan 052)
# Runs the import script against Supabase using GitHub Secrets.
#
# Usage:
#   1. Go to Actions → "Import MuslimBusiness Providers"
#   2. Click "Run workflow"
#   3. Choose mode (dry-run or write) and limit
#   4. Review output in the workflow logs
#
# Security:
#   - Uses SUPABASE_SERVICE_ROLE_KEY from GitHub Secrets (never exposed in logs)
#   - Requires manual trigger (workflow_dispatch) — no accidental runs
#   - Dry-run is the default to prevent unintended writes

name: Import MuslimBusiness Providers

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Import mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - write
      limit:
        description: 'Number of providers to process (10, 50, 100, all)'
        required: true
        default: '50'
        type: choice
        options:
          - '10'
          - '50'
          - '100'
          - 'all'
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - uat

jobs:
  import:
    name: Import Providers (${{ inputs.mode }}, limit=${{ inputs.limit }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run import
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          echo "🚀 Running MuslimBusiness import against $INPUT_ENVIRONMENT"
          echo "   Mode: $INPUT_MODE"
          echo "   Limit: $INPUT_LIMIT"
          echo ""

          if [ "$INPUT_LIMIT" = "all" ]; then
            npx tsx scripts/import-muslimbusiness.ts --"$INPUT_MODE"
          else
            npx tsx scripts/import-muslimbusiness.ts --"$INPUT_MODE" --limit "$INPUT_LIMIT"
          fi

      - name: Summary
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_LIMIT: ${{ inputs.limit }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "## Import Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | $INPUT_ENVIRONMENT |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | $INPUT_MODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Limit | $INPUT_LIMIT |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | $ACTOR |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY

          if [ "$INPUT_MODE" = "write" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Records inserted with \`review_status = 'pending'\`**" >> $GITHUB_STEP_SUMMARY
            echo "Imported cohort query:" >> $GITHUB_STEP_SUMMARY
            echo "\`SELECT * FROM providers WHERE user_created_id = '00000000-0000-0000-0000-000052000001';\`" >> $GITHUB_STEP_SUMMARY
          fi
