name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    # Production deployments are always manual (works on GitHub Free tier)

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - name: Check nginx config changed
        id: nginx-check
        run: |
          # For manual deployments, always upload (no previous commit to compare)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            if git diff --name-only HEAD~1 HEAD | grep -q 'deploy/nginx/nginx-template.conf'; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Upload Nginx config to Hetzner
        if: steps.nginx-check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: 'deploy/nginx/nginx-template.conf'
          target: '/tmp/'

      - name: Verify deployment confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "deploy" ]; then
            echo "❌ Deployment not confirmed. You must type 'deploy' to proceed."
            echo "Received: '${{ github.event.inputs.confirm_deploy }}'"
            exit 1
          fi
          echo "✅ Deployment confirmed - proceeding with production deployment"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/uflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=https://ummahflow.com
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_FEATURE_ISAPPLAUNCHED=${{ secrets.NEXT_PUBLIC_FEATURE_ISAPPLAUNCHED }}
            DISABLE_PWA=false
          platforms: linux/amd64

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /tmp

            # Blue-green deployment: Start new container on temp port, verify, then swap
            OLD_CONTAINER=$(docker ps -q -f name=uflow-app) || true

            echo "📦 Pulling new image from GHCR..."
            IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/uflow:latest"

            # Use PAT if available, otherwise try GITHUB_TOKEN (may need package:read permission)
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "🔐 Logging in to GHCR with PAT..."
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            else
              echo "⚠️ GHCR_PAT not found, trying GITHUB_TOKEN (may not work for private repos)"
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            fi

            echo "🔍 Attempting to pull: $IMAGE_NAME"
            if ! docker pull "$IMAGE_NAME"; then
              echo ""
              echo "❌ Failed to pull image from GHCR"
              echo "   Image: $IMAGE_NAME"
              echo ""
              echo "   Possible causes:"
              echo "   1. Image doesn't exist yet (build step may have failed)"
              echo "   2. GHCR_PAT token doesn't have 'read:packages' permission"
              echo "   3. Package visibility is set to private and token can't access it"
              echo ""
              echo "   Solutions:"
              echo "   - Check if the 'Build and push Docker image to GHCR' step succeeded"
              echo "   - Verify GHCR_PAT has 'read:packages' permission"
              echo "   - Check package visibility at: https://github.com/${{ github.repository_owner }}?tab=packages"
              echo ""
              exit 1
            fi
            echo "✅ Image pulled successfully"

            # Clean up any stale blue-green container from a previous failed deployment
            docker stop uflow-new 2>/dev/null || true
            docker rm uflow-new 2>/dev/null || true

            echo "🚀 Starting new container on temporary port 3002 (blue-green deployment)..."
            NEW_CONTAINER=$(docker run -d -p 3002:3000 \
              -e NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              -e NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -e RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
              -e NEXT_PUBLIC_SITE_URL="https://ummahflow.com" \
              -e NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
              -e TURNSTILE_SECRET_KEY="${{ secrets.TURNSTILE_SECRET_KEY }}" \
              -e ADMIN_DEBUG_KEY="${{ secrets.ADMIN_DEBUG_KEY }}" \
              -e WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}" \
              -e DISABLE_PWA=false \
              -e MISTRAL_API_KEY="${{ secrets.MISTRAL_API_KEY }}" \
              -v uflow-image-cache:/app/.next/cache/images \
              --name uflow-new \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/uflow:latest)

            echo "⏳ Waiting for new container to start..."
            sleep 3

            echo "🏥 Health check on new container (port 3002)..."
            HEALTH_CHECK_FAILED=true
            for i in {1..20}; do
                if curl -f http://localhost:3002/api/health > /dev/null 2>&1; then
                    echo "✅ New container is healthy"
                    HEALTH_CHECK_FAILED=false
                    break
                fi
                echo "Health check attempt $i/20..."
                sleep 1
            done

            if [ "$HEALTH_CHECK_FAILED" = "true" ]; then
                echo "❌ Health check failed on new container - cleaning up..."
                docker logs --tail 50 uflow-new
                docker stop uflow-new || true
                docker rm uflow-new || true
                exit 1
            fi

            echo "🔄 Swapping containers (zero-downtime deployment)..."
            # Stop old container
            if [ -n "$OLD_CONTAINER" ]; then
                echo "🛑 Stopping old container..."
                docker stop uflow-app || true
                docker rm uflow-app || true
            fi

            # Stop new container and restart on production port
            echo "🔄 Moving new container to production port 3000..."
            docker stop uflow-new || true
            docker rm uflow-new || true

            # Start on production port
            docker run -d -p 3000:3000 \
              -e NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              -e NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -e RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
              -e NEXT_PUBLIC_SITE_URL="https://ummahflow.com" \
              -e NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
              -e TURNSTILE_SECRET_KEY="${{ secrets.TURNSTILE_SECRET_KEY }}" \
              -e ADMIN_DEBUG_KEY="${{ secrets.ADMIN_DEBUG_KEY }}" \
              -e WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}" \
              -e DISABLE_PWA=false \
              -e MISTRAL_API_KEY="${{ secrets.MISTRAL_API_KEY }}" \
              -v uflow-image-cache:/app/.next/cache/images \
              --name uflow-app \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/uflow:latest

            echo "✅ Container swap complete"

            echo "🔧 Updating Nginx..."
            # scp-action v1.0.0 preserves relative source path, so file may be
            # at /tmp/nginx-template.conf (legacy) or /tmp/deploy/nginx/nginx-template.conf
            if [ -f /tmp/nginx-template.conf ]; then
              CONFIG_SRC=/tmp/nginx-template.conf
            elif [ -f /tmp/deploy/nginx/nginx-template.conf ]; then
              CONFIG_SRC=/tmp/deploy/nginx/nginx-template.conf
            else
              echo "❌ Error: nginx-template.conf not found (checked /tmp/ and /tmp/deploy/nginx/)"
              exit 1
            fi
            sed "s/{{DOMAIN}}/ummahflow.com/g" "$CONFIG_SRC" > /etc/nginx/sites-available/ummahflow

            echo "🧪 Testing Nginx config..."
            if nginx -t; then
                systemctl reload nginx
                echo "✅ Nginx reloaded"
            else
                echo "❌ Nginx config invalid"
                exit 1
            fi

            echo "🌐 Verifying deployment..."
            sleep 3
            if curl -f https://ummahflow.com/api/health > /dev/null 2>&1; then
                echo "✅ Deployment successful!"
            else
                echo "⚠️ Health check through domain failed (may need DNS propagation)"
            fi

            echo "🎉 Deployment complete!"

      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live URL:** https://ummahflow.com" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check:** https://ummahflow.com/api/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 Production is now live!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** This was a manual production deployment. Always test in UAT first!" >> $GITHUB_STEP_SUMMARY
