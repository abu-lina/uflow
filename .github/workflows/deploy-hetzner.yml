name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    # Production deployments are always manual (works on GitHub Free tier)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify deployment confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "deploy" ]; then
            echo "❌ Deployment not confirmed. You must type 'deploy' to proceed."
            echo "Received: '${{ github.event.inputs.confirm_deploy }}'"
            exit 1
          fi
          echo "✅ Deployment confirmed - proceeding with production deployment"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/uflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=https://ummahflow.com
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_FEATURE_ISAPPLAUNCHED=${{ secrets.NEXT_PUBLIC_FEATURE_ISAPPLAUNCHED }}
            DISABLE_PWA=false
          platforms: linux/amd64
      
      - name: Upload Nginx config to Hetzner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "nginx-template.conf"
          target: "/tmp/"
      
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /tmp
            
            # Store old container ID for rollback
            OLD_CONTAINER=$(docker ps -q -f name=uflow-app) || true
            
            echo "🛑 Stopping old container..."
            docker stop uflow-app || true
            docker rm uflow-app || true
            
            echo "🔍 Checking for any containers using port 3000..."
            # Find all running containers and check if any use port 3000
            for CONTAINER in $(docker ps -q); do
                if docker port $CONTAINER 2>/dev/null | grep -q ":3000"; then
                    echo "⚠️ Found container $CONTAINER using port 3000, stopping it..."
                    docker stop $CONTAINER || true
                    docker rm $CONTAINER || true
                fi
            done
            
            echo "⏸️ Waiting for port 3000 to be released..."
            sleep 3
            
            echo "📦 Pulling new image from GHCR..."
            # Use PAT if available, otherwise try GITHUB_TOKEN (may need package:read permission)
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            else
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            fi
            docker pull ghcr.io/${{ github.repository_owner }}/uflow:latest
            
            echo "🚀 Starting new container..."
            NEW_CONTAINER=$(docker run -d -p 3000:3000 \
              -e NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
              -e NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
              -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -e RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
              -e NEXT_PUBLIC_SITE_URL="https://ummahflow.com" \
              -e NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}" \
              -e TURNSTILE_SECRET_KEY="${{ secrets.TURNSTILE_SECRET_KEY }}" \
              -e DISABLE_PWA=false \
              --name uflow-app \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/uflow:latest)
            
            echo "⏳ Waiting for app to start..."
            sleep 10
            
            echo "🏥 Health check..."
            HEALTH_CHECK_FAILED=true
            for i in {1..30}; do
                if curl -f http://localhost:3000/api/health > /dev/null 2>&1; then
                    echo "✅ App is healthy"
                    HEALTH_CHECK_FAILED=false
                    break
                fi
                echo "Health check attempt $i/30..."
                sleep 2
            done
            
            if [ "$HEALTH_CHECK_FAILED" = "true" ]; then
                echo "❌ Health check failed - rolling back..."
                docker logs --tail 50 uflow-app
                docker stop uflow-app || true
                docker rm uflow-app || true
                if [ -n "$OLD_CONTAINER" ]; then
                    echo "🔄 Restarting old container..."
                    docker start $OLD_CONTAINER || true
                fi
                exit 1
            fi
            
            echo "🔧 Updating Nginx..."
            sed "s/{{DOMAIN}}/ummahflow.com/g" /tmp/nginx-template.conf > /etc/nginx/sites-available/ummahflow
            
            echo "🧪 Testing Nginx config..."
            if nginx -t; then
                systemctl reload nginx
                echo "✅ Nginx reloaded"
            else
                echo "❌ Nginx config invalid"
                exit 1
            fi
            
            echo "🌐 Verifying deployment..."
            sleep 3
            if curl -f https://ummahflow.com/api/health > /dev/null 2>&1; then
                echo "✅ Deployment successful!"
            else
                echo "⚠️ Health check through domain failed (may need DNS propagation)"
            fi
            
            echo "🎉 Deployment complete!"
      
      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live URL:** https://ummahflow.com" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check:** https://ummahflow.com/api/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 Production is now live!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** This was a manual production deployment. Always test in UAT first!" >> $GITHUB_STEP_SUMMARY
