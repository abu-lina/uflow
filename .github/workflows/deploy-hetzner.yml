name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        docker build -t uflow:latest \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
          --platform linux/amd64 .
    
    - name: Save Docker image
      run: |
        docker save uflow:latest | gzip > uflow.tar.gz
    
    - name: Deploy to Hetzner
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HETZNER_HOST }}
        username: root
        key: ${{ secrets.HETZNER_SSH_KEY }}
        script: |
          cd /tmp
          docker stop uflow-app || true
          docker rm uflow-app || true
          docker load < uflow.tar.gz
          docker run -d -p 3000:3000 --name uflow-app uflow:latest
          
          # Fix Nginx configuration for CSS MIME types
          cat > /etc/nginx/sites-available/ummahflow << 'NGINX_CONFIG'
          server {
              listen 443 ssl http2;
              server_name ummahflow.com www.ummahflow.com;

              # SSL configuration
              ssl_certificate /etc/letsencrypt/live/ummahflow.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/ummahflow.com/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
              ssl_prefer_server_ciphers off;

              # Security headers (removed X-Content-Type-Options to fix CSS MIME issue)
              add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-XSS-Protection "1; mode=block" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co;" always;

              # Hide server version
              server_tokens off;

              location / {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }
          }

          # Redirect HTTP to HTTPS
          server {
              listen 80;
              server_name ummahflow.com www.ummahflow.com;
              return 301 https://$server_name$request_uri;
          }
          NGINX_CONFIG
          
          # Test and reload nginx
          nginx -t && systemctl reload nginx
          rm -f uflow.tar.gz
          echo "✅ Deployment complete!"
