<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Email Confirmed - Mobile Preview (Lucide Icons)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to bottom, #F5F5F5, #FBFBFB);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            max-width: 430px;
            margin: 0 auto;
        }

        body::before {
            content: '📱 Mobile View - With Lucide Icons';
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(88, 157, 150, 0.9);
            color: white;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            z-index: 1000;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 24px 16px;
            width: 100%;
            max-width: 375px;
        }

        /* Success Icon */
        .success-icon {
            width: 96px;
            height: 96px;
            color: #10b981; /* text-success */
            margin-bottom: 16px;
            animation: scaleIn 0.5s ease-out;
        }

        .error-icon {
            width: 96px;
            height: 96px;
            color: #DC2626; /* text-danger */
            margin-bottom: 16px;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Title */
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #232323; /* text-content-title */
            margin-bottom: 16px;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        /* Description */
        .description {
            font-size: 16px;
            color: #555555; /* text-content */
            margin-bottom: 24px;
            animation: fadeInUp 0.6s ease-out 0.4s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Spinner */
        .spinner {
            width: 32px;
            height: 32px;
            color: #589D96; /* text-mint */
            animation: spin 1s linear infinite, fadeInUp 0.6s ease-out 0.6s both;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            z-index: 100;
            min-width: 340px;
            max-width: 90%;
        }

        .control-title {
            font-size: 13px;
            font-weight: 600;
            color: #272727;
            text-align: center;
            margin-bottom: 12px;
        }

        .control-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-button {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #D4D4D4;
            background: white;
            color: #272727;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-button:hover {
            background: #f8f9fa;
            border-color: #589D96;
        }

        .control-button.active {
            background: #589D96;
            color: white;
            border-color: #589D96;
        }

        .info-text {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin: 8px 0 4px 0;
        }

        .size-info {
            text-align: center;
            font-size: 10px;
            color: #999;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #E5E5E5;
        }
    </style>
</head>
<body>
    <!-- Success Content -->
    <div class="container" id="container">
        <!-- SVG Icons will be inserted here by JavaScript -->
    </div>

    <!-- Demo Controls -->
    <div class="controls">
        <div class="control-title">🎨 Try Different States</div>
        
        <div class="control-buttons">
            <button class="control-button active" onclick="showState('success')">
                ✓ Success
            </button>
            <button class="control-button" onclick="showState('error')">
                ✗ Error
            </button>
            <button class="control-button" onclick="showState('loading')">
                ↻ Loading
            </button>
        </div>
        
        <div class="info-text">Icon Library: Lucide React</div>
        
        <div class="control-buttons">
            <button class="control-button" onclick="changeLanguage('en')">
                English
            </button>
            <button class="control-button" onclick="changeLanguage('de')">
                Deutsch
            </button>
        </div>
        
        <div class="size-info" id="sizeInfo">
            Current icon: CheckCircle • Size: 96px (icon-3xl)
        </div>
    </div>

    <script>
        let currentState = 'success';
        let currentLang = 'en';

        const states = {
            success: {
                icon: `<svg class="success-icon" xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`,
                title: {
                    en: 'Email confirmed successfully!',
                    de: 'E-Mail erfolgreich bestätigt!'
                },
                description: {
                    en: 'Redirecting to your dashboard...',
                    de: 'Weiterleitung zu deinem Dashboard...'
                },
                showSpinner: true,
                iconName: 'CheckCircle',
                size: '96px (icon-3xl)'
            },
            error: {
                icon: `<svg class="error-icon" xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`,
                title: {
                    en: 'Error confirming email',
                    de: 'Fehler beim Bestätigen'
                },
                description: {
                    en: 'Please try again or contact support.',
                    de: 'Bitte versuche es erneut oder kontaktiere den Support.'
                },
                showSpinner: false,
                iconName: 'XCircle',
                size: '96px (icon-3xl)'
            },
            loading: {
                icon: `<svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>`,
                title: {
                    en: 'Confirming your email...',
                    de: 'E-Mail wird bestätigt...'
                },
                description: {
                    en: 'Please wait a moment',
                    de: 'Bitte warten Sie einen Moment'
                },
                showSpinner: false,
                iconName: 'Loader2',
                size: '48px (icon-xl)'
            }
        };

        function showState(state) {
            currentState = state;
            
            // Update active button
            document.querySelectorAll('.control-button').forEach(btn => {
                if (btn.onclick && btn.onclick.toString().includes('showState')) {
                    btn.classList.remove('active');
                }
            });
            event.target.classList.add('active');
            
            render();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            
            // Update active button
            document.querySelectorAll('.control-button').forEach(btn => {
                if (btn.onclick && btn.onclick.toString().includes('changeLanguage')) {
                    btn.classList.remove('active');
                }
            });
            event.target.classList.add('active');
            
            render();
        }

        function render() {
            const state = states[currentState];
            const container = document.getElementById('container');
            
            let html = state.icon;
            html += `<h1 class="title">${state.title[currentLang]}</h1>`;
            html += `<p class="description">${state.description[currentLang]}</p>`;
            
            if (state.showSpinner) {
                html += `<svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>`;
            }
            
            container.innerHTML = html;
            
            // Update size info
            document.getElementById('sizeInfo').textContent = 
                `Current icon: ${state.iconName} • Size: ${state.size}`;
        }

        // Initial render
        render();

        console.log('✅ Mobile Email Confirmation - Lucide Icons');
        console.log('📱 No more emojis! All icons from Lucide library');
        console.log('👉 Try different states and languages!');
    </script>
</body>
</html>
