<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Email Confirmed - Final Design (MailCheck)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mint: { DEFAULT: '#589D96', light: '#BFDBD8' },
                        content: { DEFAULT: '#555555', title: '#232323' },
                        success: '#10b981',
                        danger: '#DC2626',
                        info: '#3b82f6',
                    },
                    spacing: {
                        'icon-xs': '16px', 'icon-sm': '20px', 'icon-md': '24px',
                        'icon-lg': '32px', 'icon-xl': '48px', 'icon-2xl': '64px', 'icon-3xl': '96px',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-scale-in { animation: scaleIn 0.5s ease-out; }
        .animate-fade-up-1 { animation: fadeInUp 0.6s ease-out 0.2s both; }
        .animate-fade-up-2 { animation: fadeInUp 0.6s ease-out 0.4s both; }
        .animate-fade-up-3 { animation: fadeInUp 0.6s ease-out 0.6s both; }
    </style>
</head>
<body class="bg-gradient-to-b from-[#F5F5F5] to-[#FBFBFB]">
    
    <!-- Mobile Indicator -->
    <div class="fixed top-2 left-1/2 -translate-x-1/2 z-50 bg-success text-white px-4 py-1.5 rounded-full text-xs font-semibold shadow-lg">
        ✅ Final Design - MailCheck Icon
    </div>

    <!-- Main Content -->
    <div class="min-h-screen flex items-center justify-center px-4 max-w-[375px] mx-auto">
        <div class="text-center w-full" id="container">
            <!-- MailCheck Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-icon-3xl h-icon-3xl text-success mx-auto mb-4 animate-scale-in">
                <path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h8"></path>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                <path d="m16 19 2 2 4-4"></path>
            </svg>
            
            <h1 class="text-2xl font-bold text-content-title mb-4 animate-fade-up-1">
                E-Mail erfolgreich bestätigt!
            </h1>
            
            <p class="text-content mb-6 animate-fade-up-2">
                Weiterleitung zu deinem Dashboard...
            </p>
            
            <!-- Loader2 Spinner -->
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-icon-lg h-icon-lg text-mint animate-spin mx-auto animate-fade-up-3">
                <line x1="12" x2="12" y1="2" y2="6"></line>
                <line x1="12" x2="12" y1="18" y2="22"></line>
                <line x1="4.93" x2="7.76" y1="4.93" y2="7.76"></line>
                <line x1="16.24" x2="19.07" y1="16.24" y2="19.07"></line>
                <line x1="2" x2="6" y1="12" y2="12"></line>
                <line x1="18" x2="22" y1="12" y2="12"></line>
                <line x1="4.93" x2="7.76" y1="19.07" y2="16.24"></line>
                <line x1="16.24" x2="19.07" y1="7.76" y2="4.93"></line>
            </svg>
        </div>
    </div>

    <!-- Controls -->
    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-white p-4 rounded-xl shadow-xl max-w-[340px] w-[90%]">
        <div class="text-center text-sm font-semibold text-content-title mb-3">
            🎨 Design Controls
        </div>
        
        <!-- Language Toggle -->
        <div class="flex gap-2 mb-3">
            <button onclick="changeLanguage('de')" class="lang-btn flex-1 px-3 py-2 rounded-lg border transition-all bg-mint text-white border-mint">
                Deutsch
            </button>
            <button onclick="changeLanguage('en')" class="lang-btn flex-1 px-3 py-2 rounded-lg border transition-all bg-white text-gray-700 border-gray-300 hover:border-mint">
                English
            </button>
        </div>

        <!-- Size Options -->
        <div class="text-center text-[10px] text-gray-500 mb-2">Icon Size:</div>
        <div class="flex gap-2 mb-3">
            <button onclick="changeSize('icon-2xl', '64px')" class="size-btn flex-1 px-2 py-1.5 rounded-md border text-[10px] transition-all bg-white border-gray-300 hover:border-mint">
                2XL (64px)
            </button>
            <button onclick="changeSize('icon-3xl', '96px')" class="size-btn flex-1 px-2 py-1.5 rounded-md border text-[10px] transition-all bg-mint text-white border-mint">
                3XL (96px)
            </button>
            <button onclick="changeSize('icon-[120px]', '120px')" class="size-btn flex-1 px-2 py-1.5 rounded-md border text-[10px] transition-all bg-white border-gray-300 hover:border-mint">
                Custom 120px
            </button>
        </div>

        <!-- Replay Animation -->
        <button onclick="replay()" class="w-full px-3 py-2 rounded-lg bg-mint/10 text-mint text-xs font-medium hover:bg-mint/20 transition-all">
            🔄 Replay Animation
        </button>
        
        <div class="text-center text-[9px] text-gray-400 mt-3 pt-3 border-t border-gray-200">
            <strong class="text-success">MailCheck</strong> • Tailwind Classes
            <br>
            <code class="text-[8px]">w-<span id="currentSize">icon-3xl</span> h-<span id="currentSize2">icon-3xl</span> text-success</code>
        </div>
    </div>

    <script>
        let currentLang = 'de';
        let currentIconSize = 'icon-3xl';

        const content = {
            de: {
                title: 'E-Mail erfolgreich bestätigt!',
                description: 'Weiterleitung zu deinem Dashboard...'
            },
            en: {
                title: 'Email confirmed successfully!',
                description: 'Redirecting to your dashboard...'
            }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            
            // Update buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('bg-mint', 'text-white', 'border-mint');
                btn.classList.add('bg-white', 'text-gray-700', 'border-gray-300');
            });
            event.target.classList.remove('bg-white', 'text-gray-700', 'border-gray-300');
            event.target.classList.add('bg-mint', 'text-white', 'border-mint');
            
            render();
        }

        function changeSize(sizeClass, pixels) {
            currentIconSize = sizeClass;
            
            // Update buttons
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.remove('bg-mint', 'text-white', 'border-mint');
                btn.classList.add('bg-white', 'border-gray-300');
            });
            event.target.classList.remove('bg-white', 'border-gray-300');
            event.target.classList.add('bg-mint', 'text-white', 'border-mint');
            
            document.getElementById('currentSize').textContent = sizeClass;
            document.getElementById('currentSize2').textContent = sizeClass;
            
            render();
        }

        function render() {
            const container = document.getElementById('container');
            const text = content[currentLang];
            
            // Get pixel value for icon size
            let pixelSize = '96';
            if (currentIconSize === 'icon-2xl') pixelSize = '64';
            else if (currentIconSize === 'icon-[120px]') pixelSize = '120';
            
            container.innerHTML = `
                <!-- MailCheck Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="${pixelSize}" height="${pixelSize}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-${currentIconSize} h-${currentIconSize} text-success mx-auto mb-4 animate-scale-in">
                    <path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h8"></path>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    <path d="m16 19 2 2 4-4"></path>
                </svg>
                
                <h1 class="text-2xl font-bold text-content-title mb-4 animate-fade-up-1">
                    ${text.title}
                </h1>
                
                <p class="text-content mb-6 animate-fade-up-2">
                    ${text.description}
                </p>
                
                <!-- Loader2 Spinner -->
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-icon-lg h-icon-lg text-mint animate-spin mx-auto animate-fade-up-3">
                    <line x1="12" x2="12" y1="2" y2="6"></line>
                    <line x1="12" x2="12" y1="18" y2="22"></line>
                    <line x1="4.93" x2="7.76" y1="4.93" y2="7.76"></line>
                    <line x1="16.24" x2="19.07" y1="16.24" y2="19.07"></line>
                    <line x1="2" x2="6" y1="12" y2="12"></line>
                    <line x1="18" x2="22" y1="12" y2="12"></line>
                    <line x1="4.93" x2="7.76" y1="19.07" y2="16.24"></line>
                    <line x1="16.24" x2="19.07" y1="7.76" y2="4.93"></line>
                </svg>
            `;
        }

        function replay() {
            render();
        }

        // Initial render
        render();

        console.log('✅ Final Design - MailCheck Icon');
        console.log('📱 Mobile optimized (375px)');
        console.log('🎨 Using Tailwind classes: w-icon-3xl h-icon-3xl text-success');
    </script>
</body>
</html>
