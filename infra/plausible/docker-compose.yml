# Plausible Analytics CE — Self-hosted stack for UmmahFlow
# Deploy on the same Hetzner VPS as the main app (separate Docker Compose stack)
#
# Prerequisites:
#   - Docker Engine >= 23 with compose plugin
#   - Domain A-record pointing to the VPS (e.g. analytics.ummahflow.com)
#   - Nginx reverse proxy terminating TLS (see README.md for config snippet)
#
# Usage:
#   cp plausible-conf.env.example plausible-conf.env
#   # Edit plausible-conf.env — set SECRET_KEY_BASE and BASE_URL at minimum
#   docker compose up -d
#
# Architecture Note (Plan 036 ADR-006):
#   - Separate stack from the Next.js app — no shared volumes or networks
#   - Postgres stores event metadata; ClickHouse stores aggregated analytics data
#   - Both databases use named volumes for persistence across container restarts
#   - All three services restart automatically after VPS reboots (restart: unless-stopped)

version: "3.8"

services:
  # ── ClickHouse — columnar store for analytics event aggregates ───────────
  plausible_ch:
    image: clickhouse/clickhouse-server:24.3.3.102-alpine
    restart: unless-stopped
    volumes:
      - plausible_ch_data:/var/lib/clickhouse
      - plausible_ch_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - plausible_internal

  # ── Postgres — relational store for sites, goals, users ─────────────────
  plausible_db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - plausible_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: plausible
      POSTGRES_USER: plausible
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plausible -d plausible"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - plausible_internal

  # ── Plausible Analytics CE app ───────────────────────────────────────────
  plausible:
    image: ghcr.io/plausible/community-edition:v2.1.4
    restart: unless-stopped
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_ch:
        condition: service_healthy
    ports:
      # Bind only to localhost — Nginx proxies external HTTPS traffic
      - "127.0.0.1:8000:8000"
    env_file:
      - plausible-conf.env
    environment:
      # Override DATABASE_URL to use the internal Compose service name
      DATABASE_URL: postgres://plausible:${POSTGRES_PASSWORD}@plausible_db:5432/plausible
      CLICKHOUSE_DATABASE_URL: http://plausible_ch:8123/plausible
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - plausible_internal

# ── Volumes — named, managed by Docker ──────────────────────────────────────
volumes:
  plausible_db_data:
    driver: local
  plausible_ch_data:
    driver: local
  plausible_ch_logs:
    driver: local

# ── Internal network — isolated from the main app stack ─────────────────────
networks:
  plausible_internal:
    driver: bridge
