# Nginx configuration template for UAT subdomain
# This file is used to configure Nginx for uat.ummahflow.com
# UAT runs on port 3001 (separate from production on port 3000)

server {
    listen 443 ssl http2;
    server_name uat.ummahflow.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/uat.ummahflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat.ummahflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers with proper MIME type handling
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP removed - Next.js 15 overrides custom CSP, causing conflicts with Turnstile
    # Security maintained through: input validation, React escaping, CSRF, rate limiting, auth

    # Hide server version
    server_tokens off;

    # Health check endpoint
    location /api/health {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Service worker - must be served with no-cache headers
    location = /sw.js {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/javascript; charset=utf-8" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Service worker push handler - must also be served with no-cache headers.
    # Without this exact-match block, /sw-push-handler.js falls through to the
    # location ~* \.(js)$ rule below and receives Cache-Control: public, immutable
    # with a 1-year TTL. importScripts() in the service worker would then cache
    # the push handler immutably in the browser HTTP cache, preventing live updates.
    location = /sw-push-handler.js {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/javascript; charset=utf-8" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Manifest API route - proxy to Next.js with security headers
    # Cloudflare Browser Integrity Check exception required (configured in Cloudflare dashboard)
    location = /api/manifest {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Let Next.js handle Content-Type and Vary headers (already correctly set)
        # Next.js sets: Content-Type: application/manifest+json
        # Next.js sets: Vary: Accept-Language
        # Next.js sets: Cache-Control: public, max-age=3600, must-revalidate
        
        # Additional security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Next.js static JavaScript files - MUST come before CSS to match correctly
    location ~* ^/_next/static/.*\.js$ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/javascript; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Next.js static CSS files - force correct MIME type
    location ~* ^/_next/static/.*\.css$ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Type;
        add_header Content-Type "text/css; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Other JavaScript files - force correct MIME type
    location ~* \.(js)$ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Type;
        add_header Content-Type "application/javascript; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Other CSS files - force correct MIME type
    location ~* \.(css)$ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Type;
        add_header Content-Type "text/css; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location ~* \.(woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "font/woff2" always;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # All other static files in _next/static (fallback for other file types)
    # This must come AFTER the specific .js and .css blocks above
    location /_next/static/ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # Don't override Content-Type here - let upstream or more specific blocks handle it
    }

    # Admin API routes — extended timeout for long-running operations
    # (e.g., JoinHalal dry-run). Budget: 95s Nginx < 100s Cloudflare ceiling.
    # The application enforces its own 90s guard below this.
    location /api/admin/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_read_timeout 95s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chat API — extended timeout for LLM round-trips (tool calls + streaming).
    # Budget: 95s Nginx < 100s Cloudflare ceiling.
    location /api/chat {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_read_timeout 95s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main application
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name uat.ummahflow.com;
    return 301 https://$server_name$request_uri;
}







